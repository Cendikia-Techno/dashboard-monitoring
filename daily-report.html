<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily Activity Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

<style>

body{

    background:#f4f6f9;

    font-family:'Segoe UI',sans-serif;

}

.navbar{

    background:#003366;

}

.navbar-brand{

    color:white!important;

    font-weight:bold;

}

.card{

    border:none;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card-kpi{
    border:none;
    border-radius:18px;
    overflow:hidden;
    color:#fff;
    position:relative;
    transition:.3s;
}

.card-kpi:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(0,0,0,.15);
}

.bg-blue{
    background:linear-gradient(135deg,#0d6efd,#4e9cff);
}

.bg-green{
    background:linear-gradient(135deg,#198754,#4bcf7a);
}

.bg-orange{
    background:linear-gradient(135deg,#fd7e14,#ffb35c);
}

.bg-purple{
    background:linear-gradient(135deg,#6f42c1,#9d6bff);
}

.bg-red{
    background:linear-gradient(135deg,#dc3545,#ff6b7b);
}

.bg-cyan{
    background:linear-gradient(135deg,#0dcaf0,#66d9ff);
}

.kpi-title{
    font-size:14px;
    opacity:.9;
}

.kpi-value{
    font-size:34px;
    font-weight:700;
}

.kpi-icon{

    position:absolute;

    right:20px;

    top:20px;

    font-size:42px;

    opacity:.2;

}

.chart-card{

    height:420px;

}

.chart-card .card-body{

    position:relative;

    height:360px;

}

.filter-card{

    margin-top:20px;

}

.table-card{

    margin-top:20px;

}

.loading{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:white;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999;

}

</style>

</head>

<body>

<div class="loading" id="loading">

<div class="spinner-border text-primary"></div>

</div>

<nav class="navbar">

<div class="container-fluid">

<span class="navbar-brand">

<h3><i class="bi bi-bar-chart-fill"></i>

Daily Activity Project QA</h3>

</span>

    <div class="d-flex align-items-center gap-3">

        <span id="lastUpdate" class="text-white small mb-0">
            Last Update : -
        </span>

        <button id="refreshBtn"
                class="btn btn-primary btn-sm">

            <i class="bi bi-arrow-clockwise"></i>

            Refresh

        </button>

    </div>

</div>

</nav>

<div class="container-fluid mt-4">

<div class="row g-3">

<div class="col-lg-2">

<div class="card card-kpi bg-blue">

<div class="card-body">

   <i class="bi bi-list-task kpi-icon"></i>

<div class="kpi-title">Total Activity</div>

<div class="kpi-value" id="totalActivity">0</div>

</div>

</div>

</div>

<div class="col-lg-2">

<div class="card card-kpi bg-green">

<div class="card-body">
    <i class="bi bi-building kpi-icon"></i>

<div class="kpi-title">Project</div>

<div class="kpi-value" id="totalProject">0</div>

</div>

</div>

</div>

<div class="col-lg-2">

<div class="card card-kpi bg-orange">

<div class="card-body">
    <i class="bi bi-diagram-3 kpi-icon"></i>

<div class="kpi-title">Bidang</div>

<div class="kpi-value" id="totalBidang">0</div>

</div>

</div>

</div>

<div class="col-lg-2">

<div class="card card-kpi bg-purple">

<div class="card-body">
    <i class="bi bi-person-circle kpi-icon"></i>

<div class="kpi-title">PIC</div>

<div class="kpi-value" id="totalPIC">0</div>

</div>

</div>

</div>

<div class="col-lg-2">

<div class="card card-kpi bg-cyan">

<div class="card-body">
    <i class="bi bi-people-fill kpi-icon"></i>

<div class="kpi-title">Koordinator</div>

<div class="kpi-value" id="totalKoordinator">0</div>

</div>

</div>

</div>

<div class="col-lg-2">

<div class="card card-kpi bg-red">

<div class="card-body">
    <i class="bi bi-calender-event kpi-icon"></i>

<div class="kpi-title">Latest Activity</div>

<div class="kpi-value" id="todayActivity">0</div>
<div id="latestDate" class="small mt-1">
    Last Report : -
</div>

</div>

</div>

</div>

</div>

<div class="row mt-4">
<!--grafik aktivitas per bidang-->

<div class="col-lg-6">

<div class="card chart-card">

<div class="card-header">

Aktivitas per Bidang

</div>

<div class="card-body">

<canvas id="bidangChart" style="height:100%;width:100%"></canvas>

</div>

</div>

</div>
<!--grafik top project-->

<div class="col-lg-6">

<div class="card chart-card">

<div class="card-header">

Top Project

</div>

<div class="card-body">

<canvas id="projectChart" style="height:100%;width:100%"></canvas>

</div>

</div>

</div>
<!--grafik aktivitas per Hari-->
<div class="row mt-4">

<div class="col-lg-12">

<div class="card chart-card">

<div class="card-header">
    <span id="dailyChartTitle">
        Aktivitas 7 Hari Terakhir
    </span>

</div>

<div class="card-body">

<canvas id="dailyChart"></canvas>

</div>

</div>

</div>

</div>
</div>

<div class="card filter-card">

<div class="card-body">

<div class="row">

<div class="col-lg-2">

<select class="form-select" id="projectFilter">

<option value="">Semua Proyek</option>

</select>

</div>

<div class="col-lg-2">

<select class="form-select" id="bidangFilter">

<option value="">Semua Bidang</option>

</select>

</div>

<div class="col-lg-2">

<select class="form-select" id="picFilter">

<option value="">Semua PIC</option>

</select>

</div>

<div class="col-lg-2">

<input
type="date"
class="form-control"
id="startDate">

</div>

<div class="col-lg-2">

<input
type="date"
class="form-control"
id="endDate">

</div>

<div class="col-lg-2">

<button
class="btn btn-primary w-100"
id="resetFilter">

Reset Filter

</button>

</div>

</div>

</div>

</div>

<div class="card table-card">

<div class="card-body">

<table
id="dailyTable"
class="table table-striped table-hover w-100">

<thead>

<tr>

<th>Tanggal</th>

<th>Proyek</th>

<th>Bidang</th>

<th>PIC</th>

<th>Koordinator</th>

<th>Aktivitas</th>

<th>Status</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyaOtc8dICaFRFH827P2KJjmdYewVOwhpGnegIUKm_ge9nn--8hEBOo8OAqGV5Be9Dj/exec";

let dailyData = [];
let table;
let filteredData = [];
let bidangChart;
let projectChart;
let dailyChart;

async function loadData(showLoading = true) {

    const btn = document.getElementById("refreshBtn");

    try {

        if (showLoading) {

            document.getElementById("loading").style.display = "flex";

        }

        if (btn) {

            btn.disabled = true;

            btn.innerHTML =
                '<span class="spinner-border spinner-border-sm"></span> Refreshing...';

        }

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("HTTP Error : " + response.status);
        }

        const json = await response.json();

        dailyData = json.dailyData || [];

        filteredData = [...dailyData];
        fillFilter(
            "projectFilter",
            dailyData.map(x=>x.proyek)
        );

        fillFilter(
            "bidangFilter",
            dailyData.map(x=>x.bidang)
        );

        fillFilter(
            "picFilter",
            dailyData.map(x=>x.pic)
        );

        refreshDashboard();

        const lastUpdate = document.getElementById("lastUpdate");

        if (lastUpdate) {

            lastUpdate.innerHTML =
                "Last Update : " +
                new Date().toLocaleString("id-ID");

        }

    } catch (err) {

        console.error("Load Data Error :", err);

        alert("Gagal mengambil data.\n" + err.message);

    } finally {

        const loading = document.getElementById("loading");

        if (loading) {

            loading.style.display = "none";

        }

        if (btn) {

            btn.disabled = false;

            btn.innerHTML =
                '<i class="bi bi-arrow-clockwise"></i> Refresh';

        }

    }

}

function refreshDashboard(){

    renderSummary();

    renderTable();

    renderBidangChart();

    renderProjectChart();

    renderDailyChart();

}

function renderSummary(){

    document.getElementById("totalActivity").innerHTML =
        filteredData.length;

    document.getElementById("totalProject").innerHTML =
        new Set(filteredData.map(x=>x.proyek)).size;

    document.getElementById("totalBidang").innerHTML =
        new Set(filteredData.map(x=>x.bidang)).size;

    document.getElementById("totalPIC").innerHTML =
        new Set(filteredData.map(x=>x.pic)).size;

    document.getElementById("totalKoordinator").innerHTML =
        new Set(filteredData.map(x=>x.koordinator)).size;

    // Cari tanggal terbaru dari data
    const latestDate = filteredData.reduce((latest, item) => {

        if (!item.pelaporanDate) return latest;

        const current = item.pelaporanDate.split('/').reverse().join('-');
        const max = latest.split('/').reverse().join('-');

        return new Date(current) > new Date(max)
            ? item.pelaporanDate
            : latest;

    }, filteredData[0]?.pelaporanDate || "");

    // Hitung jumlah aktivitas pada tanggal terbaru
    const latestCount = filteredData.filter(
        x => x.pelaporanDate === latestDate
    ).length;

    // Tampilkan jumlah
    document.getElementById("todayActivity").innerHTML = latestCount;

    // Tampilkan tanggal terakhir
    document.getElementById("latestDate").innerHTML =
        "Last Report : " + latestDate;

}

function fillFilter(id,data){

    const select =
        document.getElementById(id);

    const first =
        select.options[0].text;

    select.innerHTML =
        `<option value="">${first}</option>`;

    [...new Set(data)]
        .sort()
        .forEach(item=>{

            if(item){

                select.innerHTML+=
                `<option value="${item}">
                ${item}
                </option>`;

            }

        });

}

function renderTable(){

    if($.fn.DataTable.isDataTable("#dailyTable")){

        $("#dailyTable").DataTable().destroy();

    }

    $("#dailyTable").DataTable({

        data: filteredData,

        pageLength:25,

        columns:[

            {data:"pelaporanDate"},

            {data:"proyek"},

            {data:"bidang"},

            {data:"pic"},

            {data:"koordinator"},

            {data:"pekerjaan"},

            {

                data:null,

                render:function(data){

                    return getStatusBadge(data.pekerjaan);

                }

            }

        ]

    });

}

function renderBidangChart(){

    const count = {};

    filteredData.forEach(item=>{

        count[item.bidang] =
            (count[item.bidang]||0)+1;

    });

    if(bidangChart){

        bidangChart.destroy();

    }

    bidangChart = new Chart(
        document.getElementById("bidangChart"),
        {

            type:"bar",

            data:{

                labels:Object.keys(count),

                datasets:[{

                    label:"Aktivitas",

                    data:Object.values(count)

                }]

            },

            options:{

                responsive:true,
                maintainAspectRatio:false,
                onClick:function(evt,item){

                    if(item.length){

                        const bidang =
                            this.data.labels[item[0].index];

                        document
                            .getElementById("bidangFilter")
                            .value = bidang;

                        applyFilter();

                    }

                },

                plugins:{
                    legend:{
                        display:false
                    }
                }

            }

        });

}

function renderProjectChart(){

    const count={};

    filteredData.forEach(item=>{

        count[item.proyek] =
            (count[item.proyek]||0)+1;

    });

    const sorted =
        Object.entries(count)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,10);

    if(projectChart){

        projectChart.destroy();

    }

    projectChart = new Chart(

        document.getElementById("projectChart"),

        {

            type:"bar",

            data:{

                labels:sorted.map(x=>x[0]),

                datasets:[{

                    data:sorted.map(x=>x[1])

                }]

            },

            options:{

                indexAxis:'y',
                maintainAspectRatio:false,
                onClick:function(evt,item){

                    if(item.length){

                        const proyek =
                            this.data.labels[item[0].index];

                        document
                            .getElementById("projectFilter")
                            .value = proyek;

                        applyFilter();

                    }

                },

                plugins:{
                    legend:{
                        display:false
                    }
                }

            }

        });

}

function renderDailyChart() {

    const count = {};
    
    filteredData.forEach(item => {

        const tgl = item.pelaporanDate;

        count[tgl] = (count[tgl] || 0) + 1;

    });

    const labels = Object.keys(count)
        .sort((a, b) => {

            const da = a.split('/').reverse().join('-');
            const db = b.split('/').reverse().join('-');

            return new Date(da) - new Date(db);

        })
        .slice(-7);   // Ambil 7 tanggal terakhir

    const values = labels.map(tgl => count[tgl]);
    const start = labels[0];
    const end = labels[labels.length - 1];

    document.getElementById("dailyChartTitle").innerHTML =
    `Aktivitas 7 Hari Terakhir (${start} - ${end})`;


    if (dailyChart) {
        dailyChart.destroy();
    }

    dailyChart = new Chart(
        document.getElementById("dailyChart"),
        {
            type: "line",

            data: {

                labels: labels,

                datasets: [{

                    label: "Jumlah Aktivitas",

                    data: values,

                    borderWidth: 3,

                    tension: 0.35,

                    fill: true

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        display: false

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            precision: 0

                        }

                    }

                }

            }

        });

}

function applyFilter(){

    const proyek =
        document.getElementById("projectFilter").value;

    const bidang =
        document.getElementById("bidangFilter").value;

    const pic =
        document.getElementById("picFilter").value;

    const start =
        document.getElementById("startDate").value;

    const end =
        document.getElementById("endDate").value;

    filteredData = dailyData.filter(item=>{

        let ok = true;

        if(proyek && item.proyek!==proyek)
            ok=false;

        if(bidang && item.bidang!==bidang)
            ok=false;

        if(pic && item.pic!==pic)
            ok=false;

        if (start && item.tanggal < start) ok = false;

        if (end && item.tanggal > end) ok = false;

        return ok;

    });

    renderSummary();

   renderTable();

    setTimeout(() => {

        renderBidangChart();

        renderProjectChart();

        renderDailyChart();

    },100);

}

function getStatusBadge(text){

    text=(text||"").toLowerCase();

    if(text.includes("acc")||
       text.includes("baik")||
       text.includes("diterima")){

        return `<span class="badge bg-success">
        <i class="bi bi-check-circle-fill"></i>
        ACC
        </span>`;

    }

    if(text.includes("progress")){

        return `<span class="badge bg-warning text-dark">
        <i class="bi bi-hourglass-split"></i>
        Progress
        </span>`;

    }

    if(
        text.includes("repair")||
        text.includes("crack")||
        text.includes("cacat")||
        text.includes("gagal")||
        text.includes("miss")||
        text.includes("penyempurnaan")
    ){

        return `<span class="badge bg-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        Temuan
        </span>`;

    }

    return `<span class="badge bg-secondary">
    Info
    </span>`;

}

function renderDashboard(){

    renderSummary();

    fillFilter(
        "projectFilter",
        dailyData.map(x=>x.proyek)
    );

    fillFilter(
        "bidangFilter",
        dailyData.map(x=>x.bidang)
    );

    fillFilter(
        "picFilter",
        dailyData.map(x=>x.pic)
    );

    renderTable();

    document.getElementById("lastUpdate").innerHTML =
        "Last Update : " +
        new Date().toLocaleString("id-ID");

    renderBidangChart();

    renderProjectChart();

}

window.onload=function(){

    loadData();

}

document
.getElementById("projectFilter")
.addEventListener("change",applyFilter);

document
.getElementById("bidangFilter")
.addEventListener("change",applyFilter);

document
.getElementById("picFilter")
.addEventListener("change",applyFilter);

document
.getElementById("startDate")
.addEventListener("change",applyFilter);

document
.getElementById("endDate")
.addEventListener("change",applyFilter);

document
.getElementById("resetFilter")
.addEventListener("click",()=>{

    document.getElementById("projectFilter").value="";

    document.getElementById("bidangFilter").value="";

    document.getElementById("picFilter").value="";

    document.getElementById("startDate").value="";

    document.getElementById("endDate").value="";

    filteredData=[...dailyData];

    renderSummary();

    renderTable();

    renderBidangChart();

    renderProjectChart();

    renderDailyChart();

});

// =========================
// BUTTON REFRESH
// =========================

document.getElementById("refreshBtn")
.addEventListener("click", () => {

    loadData(true);

});

// =========================
// AUTO REFRESH 3 MENIT
// =========================

setInterval(() => {

    loadData(false);

}, 180000);

// =========================
// PAGE LOAD
// =========================

window.onload = function () {

    loadData(true);

};

</script>


</body>

</html>
