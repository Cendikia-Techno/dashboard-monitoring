<!doctype html>
<html lang="id">
    
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Landing Dock Philipina</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #app {
      height: 100%;
      width: 100%;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-y: auto;
    }

    .progress-bar {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
    }

    .category-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.6));
      border: 1px solid rgba(71, 85, 105, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      padding: 1.5rem;
    }

    .category-card:hover {
      border-color: rgba(71, 85, 105, 0.6);
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
      transform: translateY(-2px);
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .percentage-high { color: #10b981; }
    .percentage-medium { color: #f59e0b; }
    .percentage-low { color: #ef4444; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .item-row {
      animation: slideIn 0.4s ease forwards;
    }

    .header-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div id="app" class="w-full h-full overflow-y-auto">
   <div class="w-full px-6 py-8"><!-- Header with Dashboard Selector -->
    <div class="mb-8 flex items-start justify-between">
     <div>
      <h1 class="header-title">QA Dashboard - LD Philipina 1</h1>
      <p class="text-slate-400 text-lg mt-2">Monitoring progres inspeksi & Kesiapan Launching secara real-time</p>
     </div>
     <div class="flex flex-col items-end gap-2">
      <label class="text-slate-400 text-sm font-medium">Pilih Dashboard:</label> <select id="dashboardSelector" class="px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="summary">Summary Inspeksi</option> <option value="launching">Kesiapan Launching</option> </select>
     </div>
    </div><!-- Filters for HAT/SAT Dashboard -->
    <div id="filtersContainer" class="hidden mb-6 p-4 bg-slate-800 border border-slate-700 rounded-lg">
     <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Urgensi</label> <select id="urgensiFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Urgensi</option> <option value="Prioritas">Prioritas</option> <option value="Biasa">Biasa</option> </select>
      </div>
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Status TPTR</label> <select id="statusFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Status</option> <option value="Closed">Closed</option> <option value="Proses">Proses</option> <option value="Not Available">Not Available</option> </select>
      </div>
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Status Material</label> <select id="materialFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Status Material</option> <option value="Masuk PAL">Masuk PAL</option> <option value="Selesai">Selesai</option> <option value="Proses">Proses</option> <option value="Belum Masuk">Belum Masuk</option> </select>
      </div>
     </div><button id="resetFiltersBtn" class="mt-3 px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-300 text-sm hover:bg-slate-600 transition">Reset Filters</button>
    </div><!-- Summary Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="summaryStatsContainer">
     <div class="stat-box">
      <div class="stat-label">
       Total Task
      </div>
      <div class="stat-value" id="totalTasks">
       0
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Selesai
      </div>
      <div class="stat-value" id="totalFinish">
       0
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Progress
      </div>
      <div class="stat-value percentage-high" id="overallProgress">
       0%
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Sisa Pekerjaan
      </div>
      <div class="stat-value percentage-low" id="totalRemaining">
       0
      </div>
     </div>
    </div><!-- Categories -->
    <div id="loading" class="text-center text-slate-400 py-10">
        <div class="flex justify-center items-center gap-3">
        <div class="w-5 h-5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        <span>Loading dashboard...</span>
        </div>
    </div>

    <div id="lastUpdate" class="text-slate-500 text-sm mb-4 text-right"></div>
    <div id="categoriesContainer" class="space-y-6"><!-- Content will be generated here -->
    </div>
   </div>
  </div>
  
  <script>
    let summaryData = [];
    let launchingData = [];
    
    async function loadData() {

        try {

            document.getElementById('loading').style.display = 'block';

            const response = await fetch(
                "https://script.google.com/macros/s/AKfycbwV1hUD2HM1KuZ_M8drPLbzUxhriHR9Rb1H0qFWZCGJNLPBUUHZ6bufwb4XHUGz74Z16Q/exec"
            );

            const data = await response.json();

            summaryData = data.summaryData || [];

            // fallback supaya aman
            launchingData =
                data.launchingData ||
                data.hatsatData ||
                [];

            document.getElementById('lastUpdate').textContent =
                'Last Update: ' +
                new Date().toLocaleString('id-ID');

            document.getElementById('loading').style.display = 'none';

            const selectedDashboard =
                document.getElementById('dashboardSelector').value;

            if (selectedDashboard === 'summary') {

                renderSummaryDashboard();

            } else if (selectedDashboard === 'launching') {

                renderLaunchingDashboard();
            }

        } catch (error) {

            console.error('LOAD ERROR:', error);

            document.getElementById('loading').style.display = 'none';

            document.getElementById('categoriesContainer').innerHTML = `
                <div class="text-center py-10">

                    <div class="text-red-400 text-xl mb-2">
                        Gagal mengambil data dashboard
                    </div>

                    <div class="text-slate-500 text-sm">
                        ${error.message}
                    </div>

                </div>
            `;
        }
    }

    loadData();

    setInterval(async () => {
    await loadData();
    }, 30000);

    function getStatusColor(status) {
      if (status === 'Closed') return 'bg-green-500/20 border-green-500 text-green-300';
      if (status === 'Proses') return 'bg-yellow-500/20 border-yellow-500 text-yellow-300';
      return 'bg-blue-500/20 border-blue-500 text-blue-300';
    }

    function getProgressColor(progress) {
      if (progress >= 75) return 'percentage-high';
      if (progress >= 50) return 'percentage-medium';
      return 'percentage-low';
    }

    

    function renderSummaryDashboard() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      const statContainer = document.getElementById('summaryStatsContainer');
      statContainer.style.display = 'grid';

      const grouped = summaryData.reduce((acc, item) => {
        if (!acc[item.kategori]) acc[item.kategori] = [];
        acc[item.kategori].push(item);
        return acc;
      }, {});

      let totalTasks = 0, totalFinish = 0, totalRemaining = 0;
      summaryData.forEach(item => {
        totalTasks += Number(item.totalTask) || 0;
        totalFinish += Number(item.finish) || 0;
        totalRemaining += Number(item.remaining) || 0;
      });

      const overallProgress = totalTasks > 0 ? ((totalFinish / totalTasks) * 100).toFixed(2) : 0;
      document.getElementById('totalTasks').textContent = totalTasks.toLocaleString('id-ID');
      document.getElementById('totalFinish').textContent = totalFinish.toLocaleString('id-ID');
      document.getElementById('overallProgress').textContent = overallProgress + '%';
      document.getElementById('totalRemaining').textContent = totalRemaining.toLocaleString('id-ID');

      Object.keys(grouped).forEach((kategori, idx) => {
        const items = grouped[kategori];
        let catTotalTasks = 0, catFinish = 0, catRemaining = 0;
        items.forEach(item => {
          catTotalTasks += Number(item.totalTask) || 0;
            catFinish += Number(item.finish) || 0;
            catRemaining += Number(item.remaining) || 0;
        });
        const catProgress = catTotalTasks > 0 ? ((catFinish / catTotalTasks) * 100).toFixed(2) : 0;

        let html = `
          <div class="category-card" style="animation-delay: ${idx * 0.1}s">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-slate-100">${kategori}</h2>
              <span class="text-2xl font-bold ${getProgressColor(catProgress)}">${catProgress}%</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value text-base">${catTotalTasks.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Selesai</div>
                <div class="stat-value text-base">${catFinish.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Sisa</div>
                <div class="stat-value text-base">${catRemaining.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Items</div>
                <div class="stat-value text-base">${items.length}</div>
              </div>
            </div>
            <div class="space-y-3">`;

        items.forEach((item, itemIdx) => {
          const itemProgress = Number(item.progress) || 0;
          html += `
            <div class="item-row" style="animation-delay: ${(idx * 0.1) + (itemIdx * 0.05)}s">
              <div class="flex justify-between mb-2">
                <span class="text-sm text-slate-300">${item.item}</span>
                <span class="text-sm font-semibold ${getProgressColor(itemProgress)}">${itemProgress.toFixed(2)}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${itemProgress}%"></div>
              </div>
              <div class="flex justify-between mt-1 text-xs text-slate-500">
                <span>${item.finish}/${item.totalTask}</span>
                <span>${item.remaining} sisa</span>
              </div>
            </div>`;
        });
        html += `</div></div>`;
        container.innerHTML += html;
      });
    }

    function getProgressColor(progress) {
  if (progress >= 75) return 'percentage-high';
  if (progress >= 50) return 'percentage-medium';
  return 'percentage-low';
}

function safeStatus(value) {
    return String(value || '').toLowerCase();
}

function renderLaunchingDashboard() {

    const container = document.getElementById('categoriesContainer');
    container.innerHTML = '';

    document.getElementById('filtersContainer').classList.add('hidden');

    const statContainer = document.getElementById('summaryStatsContainer');
    statContainer.style.display = 'none';

    const totalTask = launchingData.length;

    // =========================
    // KPI CALCULATION
    // =========================

    const selesai = launchingData.filter(item => {

        const status = safeStatus(item.status);

        return (
            status.includes('ok') ||
            status.includes('finish') ||
            status.includes('selesai')
        );

    }).length;

    const wip = launchingData.filter(item =>
        safeStatus(item.status).includes('wip')
    ).length;

    const notStarted = totalTask - selesai - wip;

    const criticalItems = launchingData.filter(item => {

        const today = new Date();

        const plan = new Date(item.planDate);

        return (
            plan < today &&
            !safeStatus(item.status).includes('ok') &&
            !safeStatus(item.status).includes('finish') &&
            !safeStatus(item.status).includes('selesai')
        );

    });

    const critical = criticalItems.length;

    // =========================
    // KPI CARD
    // =========================

    let html = `
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">

        <div class="stat-box border border-cyan-500/20">
            <div class="stat-label">TOTAL TASK</div>
            <div class="stat-value text-cyan-300">${totalTask}</div>
        </div>

        <div class="stat-box border border-green-500/20">
            <div class="stat-label">SELESAI</div>
            <div class="stat-value text-green-300">${selesai}</div>
        </div>

        <div class="stat-box border border-yellow-500/20">
            <div class="stat-label">WIP</div>
            <div class="stat-value text-yellow-300">${wip}</div>
        </div>

        <div class="stat-box border border-red-500/20">
            <div class="stat-label">BELUM START</div>
            <div class="stat-value text-red-300">${notStarted}</div>
        </div>

        <div class="stat-box border border-orange-500/20">
            <div class="stat-label">CRITICAL</div>
            <div class="stat-value text-orange-300">${critical}</div>
        </div>

    </div>
    `;

    // =========================
    // GROUP CATEGORY
    // =========================

    const grouped = launchingData.reduce((acc, item) => {

        if (!acc[item.kategori]) {
            acc[item.kategori] = [];
        }

        acc[item.kategori].push(item);

        return acc;

    }, {});

    // =========================
    // PROGRESS BY CATEGORY
    // =========================

    html += `
    <div class="category-card mb-8">

        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-slate-100">
                Progress By Category
            </h2>
        </div>

        <div class="space-y-5">
    `;

    Object.keys(grouped).forEach(kategori => {

        const items = grouped[kategori];

        const done = items.filter(item => {

            const status = safeStatus(item.status);

            return (
                status.includes('ok') ||
                status.includes('finish') ||
                status.includes('selesai')
            );

        }).length;

        const progress =
            ((done / items.length) * 100).toFixed(0);

        html += `
        <div>

            <div class="flex justify-between mb-2">

                <span class="text-slate-200 font-medium">
                    ${kategori}
                </span>

                <span class="${getProgressColor(progress)} font-bold">
                    ${progress}%
                </span>

            </div>

            <div class="progress-bar">

                <div class="progress-fill"
                     style="width:${progress}%">
                </div>

            </div>

            <div class="flex justify-between mt-1 text-xs text-slate-400">

                <span>${done} Finish</span>

                <span>${items.length} Total</span>

            </div>

        </div>
        `;
    });

    html += `
        </div>
    </div>
    `;

    // =========================
    // CRITICAL ACTIVITY
    // =========================

    

    html += `
    <div class="category-card mb-8">

        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-red-300">
                Critical Activity
            </h2>

            <div class="text-sm text-slate-400">
                ${criticalItems.length} Critical Items
            </div>
        </div>

        <div class="overflow-x-auto">

            <table class="w-full text-sm">

                <thead>
                    <tr class="border-b border-slate-700 text-slate-400">
                        <th class="text-left py-3 pr-4">Plan Date</th>
                        <th class="text-left py-3 pr-4">Category</th>
                        <th class="text-left py-3 pr-4">System</th>
                        <th class="text-left py-3 pr-4">Inspection</th>
                        <th class="text-left py-3 pr-4">Status</th>
                        <th class="text-left py-3 pr-4">PIC</th>
                    </tr>
                </thead>

                <tbody>
    `;

    criticalItems.forEach(item => {

        const status = String(item.status || '').toLowerCase();

        let statusColor = 'text-red-300 bg-red-500/10 border border-red-500/30';

        // WIP / progress
        if (
            status.includes('wip') ||
            status.includes('%') ||
            status.includes('progress') ||
            status.includes('material siap') ||
            status.includes('sudah')
        ) {
            statusColor = 'text-yellow-300 bg-yellow-500/10 border border-yellow-500/30';
        }

        // selesai
        if (
            status.includes('ok') ||
            status.includes('finish') ||
            status.includes('selesai')
        ) {
            statusColor = 'text-green-300 bg-green-500/10 border border-green-500/30';
        }

        html += `
        <tr class="border-b border-slate-800 hover:bg-slate-800/40 transition">

            <td class="py-3 pr-4 text-slate-300 whitespace-nowrap">
                ${item.planDate || '-'}
            </td>

            <td class="py-3 pr-4">
                <span class="text-cyan-300 font-medium">
                    ${item.kategori || '-'}
                </span>
            </td>

            <td class="py-3 pr-4 text-slate-100 font-medium">
                ${item.sistem || '-'}
            </td>

            <td class="py-3 pr-4 text-slate-400">
                ${item.inspeksi || '-'}
            </td>

            <td class="py-3 pr-4">
                <span class="px-3 py-1 rounded-lg text-xs font-semibold ${statusColor}">
                    ${item.status || 'NOT STARTED'}
                </span>
            </td>

            <td class="py-3 pr-4 text-slate-400">
                ${item.pic || '-'}
            </td>

        </tr>
        `;
    });

    html += `
                </tbody>
            </table>
        </div>
    </div>
    `;

    // =========================
    // ISSUE TRACKING
    // =========================

    html += `
    <div class="category-card">

        <div class="flex items-center justify-between mb-6">

            <h2 class="text-2xl font-bold text-orange-300">
                Issue Tracking
            </h2>

        </div>

        <div class="space-y-4">
    `;

    launchingData.forEach(item => {

        if (!item.keterangan) return;

        html += `
        <div class="p-4 rounded-xl border border-slate-700 bg-slate-800/40">

            <div class="flex items-start justify-between gap-4">

                <div class="flex-1">

                    <div class="text-slate-100 font-semibold">
                        ${item.sistem || '-'}
                    </div>

                    <div class="text-sm text-cyan-300 mt-1">
                        ${item.inspeksi || '-'}
                    </div>

                    <div class="text-sm text-slate-400 mt-3 whitespace-pre-line">
                        ${item.keterangan || '-'}
                    </div>

                </div>

                <div class="text-right min-w-[120px]">

                    <div class="text-xs text-slate-500 mb-1">
                        PIC
                    </div>

                    <div class="text-sm text-slate-200">
                        ${item.pic || '-'}
                    </div>

                </div>

            </div>

        </div>
        `;
    });

    html += `
        </div>
    </div>
    `;

    container.innerHTML = html;
}

    function getMaterialStatus(material) {

        if (!material) return '';

        material = material.toLowerCase();

        if (material.includes('masuk pal') || material.includes('selesai')) {
            return 'Masuk PAL';
        } else if (material.includes('proses')) {
            return 'Proses';
        } else if (material.includes('belum')) {
            return 'Belum Masuk';
        }

        return 'Selesai';
    }

    document.getElementById('dashboardSelector')
    .addEventListener('change', (e) => {

        if (e.target.value === 'summary') {

            renderSummaryDashboard();

            document.getElementById('filtersContainer')
            .classList.add('hidden');

        } else if (e.target.value === 'launching') {

            renderLaunchingDashboard();
        }

        lucide.createIcons();
    });

    // Filter event listeners
    document.getElementById('urgensiFilter').addEventListener('change', renderLaunchingDashboard);
    document.getElementById('statusFilter').addEventListener('change', renderLaunchingDashboard);
    document.getElementById('materialFilter').addEventListener('change', renderLaunchingDashboard);
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('urgensiFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('materialFilter').value = '';
      renderLaunchingDashboard();
    });

    
  </script>
