<!doctype html>
<html lang="id">
    
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Frigate Merah Putih</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #app {
      height: 100%;
      width: 100%;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-y: auto;
    }

    .progress-bar {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
    }

    .category-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.6));
      border: 1px solid rgba(71, 85, 105, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      padding: 1.5rem;
    }

    .category-card:hover {
      border-color: rgba(71, 85, 105, 0.6);
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
      transform: translateY(-2px);
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .percentage-high { color: #10b981; }
    .percentage-medium { color: #f59e0b; }
    .percentage-low { color: #ef4444; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .item-row {
      animation: slideIn 0.4s ease forwards;
    }

    .header-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div id="app" class="w-full h-full overflow-y-auto">
   <div class="w-full px-6 py-8"><!-- Header with Dashboard Selector -->
    <div class="mb-8 flex items-start justify-between">
     <div>
      <h1 class="header-title">Frigate Merah Putih 2</h1>
      <p class="text-slate-400 text-lg mt-2">QA Dashboard Monitoring Progress secara real-time</p>
     </div>
     <div class="flex flex-col items-end gap-2">
      <label class="text-slate-400 text-sm font-medium">Pilih Dashboard:</label> 
      <select id="dashboardSelector" class="px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition">  
        <option value="itp">ITP</option>
        <option value="qualityplan">Quality Plan</option>
        <option value="summary">Summary Inspeksi</option>
        <option value="launching">Launching</option> 
        <option value="tptr">Dokumen TPTR</option> 
        <option value="material">Monitoring Material</option> 
        <option value="hatsat">Kesiapan HAT/SAT Before Delivery</option>  
      </select>
     </div>
    </div><!-- Filters for HAT/SAT Dashboard -->
    <div id="filtersContainer" class="hidden mb-6 p-4 bg-slate-800 border border-slate-700 rounded-lg">
     <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Urgensi</label> <select id="urgensiFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Urgensi</option> <option value="Prioritas">Prioritas</option> <option value="Biasa">Biasa</option> </select>
      </div>
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Status TPTR</label> <select id="statusFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Status</option> <option value="Closed">Closed</option> <option value="Proses">Proses</option> <option value="Not Available">Not Available</option> </select>
      </div>
      <div><label class="text-slate-400 text-sm font-medium block mb-2">Filter Status Material</label> <select id="materialFilter" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-100 cursor-pointer hover:bg-slate-600 transition"> <option value="">Semua Status Material</option> <option value="Masuk PAL">Masuk PAL</option> <option value="Selesai">Selesai</option> <option value="Proses">Proses</option> <option value="Belum Masuk">Belum Masuk</option> </select>
      </div>
     </div><button id="resetFiltersBtn" class="mt-3 px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-slate-300 text-sm hover:bg-slate-600 transition">Reset Filters</button>
    </div><!-- Summary Stats -->
    <div id="loading" class="text-center text-slate-400 py-10">
        <div class="flex justify-center items-center gap-3">
        <div class="w-5 h-5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        <span>Loading dashboard...</span>
        </div>
    </div>
    <div id="overallSummaryTitle" class="hidden mb-4">

        <h2 class="text-2xl font-bold text-slate-100">
            Overall Status Summary Inspeksi
        </h2>

        <p class="text-sm text-slate-400 mt-1">
            Monitoring progress pekerjaan seluruh kategori
        </p>

    </div>
    <div 
      class="hidden grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" 
      id="summaryStatsContainer"
    >
     <div class="stat-box">
      <div class="stat-label">
       Total Task
      </div>
      <div class="stat-value" id="totalTasks">
       0
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Selesai
      </div>
      <div class="stat-value" id="totalFinish">
       0
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Progress
      </div>
      <div class="stat-value percentage-high" id="overallProgress">
       0%
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-label">
       Sisa Pekerjaan
      </div>
      <div class="stat-value percentage-low" id="totalRemaining">
       0
      </div>
     </div>
    </div><!-- Categories -->

    <div id="lastUpdate" class="text-slate-500 text-sm mb-4 text-right"></div>
    <div id="categoriesContainer" class="space-y-6"><!-- Content will be generated here -->
    </div>
   </div>
  </div>
  
  <script>
    let summaryData = [];
    let hatsatData = [];
    let itpData = [];
    let qplanData = [];
    let tptrData = [];
    let materialData = [];
    let launchingData = [];
    
    async function loadData() {

        try {

            // SHOW LOADING
            document.getElementById('loading').style.display = 'block';

            const response = await fetch("https://script.google.com/macros/s/AKfycbylpcs8nEdm3wR4yDCdTW5PFWU_qPJamDABDLxCJgP_Dx3B9mpKarYDUlh4_l08sykX8w/exec");

            const data = await response.json();

            summaryData = data.summaryData || [];
            hatsatData = data.hatsatData || [];
            itpData = data.itpData || [];
            qplanData = data.qplanData || [];
            tptrData = data.tptrData || [];
            materialData = data.materialData || [];
            launchingData = data.launchingData || [];

            // LAST UPDATE
            document.getElementById('lastUpdate').textContent =
                'Last Update: ' + new Date().toLocaleString('id-ID');

            // HIDE LOADING
            document.getElementById('loading').style.display = 'none';

            const selectedDashboard =
                document.getElementById('dashboardSelector').value;

            switch (selectedDashboard) {

                case 'summary':
                    renderSummaryDashboard();
                    break;

                case 'hatsat':
                    renderHatsatDashboard();
                    break;
                
                case 'qualityplan':
                    renderQualityPlanDashboard();
                    break;

                case 'tptr':
                    renderTPTRDashboard();
                    break;

                case 'material':
                    renderMaterialDashboard();
                    break;

                case 'launching':
                    renderLaunchingDashboard();
                    break;

                default:
                    renderITPDashboard();
            }


        } catch (error) {

            console.error(error);

            document.getElementById('loading').style.display = 'none';

            document.getElementById('categoriesContainer').innerHTML = `
                <div class="text-red-400 text-center py-10">
                    Gagal mengambil data dashboard
                </div>
            `;
        }
    }

    loadData();

    setInterval(async () => {
    await loadData();
    }, 30000);

    function getStatusColor(status) {
      if (status === 'Close') return 'bg-green-500/20 border-green-500 text-green-300';
      if (status === 'Open') return 'bg-yellow-500/20 border-yellow-500 text-yellow-300';
      return 'bg-blue-500/20 border-blue-500 text-blue-300';
    }

    function getProgressColor(progress) {
      if (progress >= 75) return 'percentage-high';
      if (progress >= 50) return 'percentage-medium';
      return 'percentage-low';
    }

    

    function renderSummaryDashboard() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      // Tampilkan judul Overall Status Summary
      document
          .getElementById('overallSummaryTitle')
          .classList.remove('hidden');
      const statContainer = document.getElementById('summaryStatsContainer');
      statContainer.classList.remove('hidden');
      statContainer.classList.add('grid');

      const grouped = summaryData.reduce((acc, item) => {
        if (!acc[item.kategori]) acc[item.kategori] = [];
        acc[item.kategori].push(item);
        return acc;
      }, {});

      let totalTasks = 0, totalFinish = 0, totalRemaining = 0;
      summaryData.forEach(item => {
        totalTasks += Number(item.totalTask) || 0;
        totalFinish += Number(item.finish) || 0;
        totalRemaining += Number(item.remaining) || 0;
      });

      const overallProgress = totalTasks > 0 ? ((totalFinish / totalTasks) * 100).toFixed(2) : 0;
      document.getElementById('totalTasks').textContent = totalTasks.toLocaleString('id-ID');
      document.getElementById('totalFinish').textContent = totalFinish.toLocaleString('id-ID');
      document.getElementById('overallProgress').textContent = overallProgress + '%';
      document.getElementById('totalRemaining').textContent = totalRemaining.toLocaleString('id-ID');
      const categorySummaryHtml = `
      <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-4 mb-8">

      ${Object.keys(grouped).map(kategori => {

          const items = grouped[kategori];

          let total = 0;
          let finish = 0;

          items.forEach(item => {

              total += Number(item.totalTask) || 0;
              finish += Number(item.finish) || 0;

          });

          const progress =
              total > 0
                  ? ((finish / total) * 100).toFixed(1)
                  : 0;

          return `

              <div class="stat-box">

                  <div class="flex justify-between mb-2">

                      <span class="text-xs text-slate-300">
                          ${kategori}
                      </span>

                      <span class="text-xs font-bold ${getProgressColor(progress)}">
                          ${progress}%
                      </span>

                  </div>

                  <div class="progress-bar mb-2">
                      <div
                          class="progress-fill"
                          style="width:${progress}%"
                      ></div>
                  </div>

                  <div class="text-xs text-slate-500">
                      ${finish}/${total}
                  </div>

              </div>

          `;

      }).join('')}

      </div>
      `;
      container.innerHTML = categorySummaryHtml;

      Object.keys(grouped).forEach((kategori, idx) => {
        const items = grouped[kategori];
        let catTotalTasks = 0, catFinish = 0, catRemaining = 0;
        items.forEach(item => {
          catTotalTasks += Number(item.totalTask) || 0;
            catFinish += Number(item.finish) || 0;
            catRemaining += Number(item.remaining) || 0;
        });
        const catProgress = catTotalTasks > 0 ? ((catFinish / catTotalTasks) * 100).toFixed(2) : 0;

        let html = `
          <div class="category-card" style="animation-delay: ${idx * 0.1}s">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-slate-100">${kategori}</h2>
              <span class="text-2xl font-bold ${getProgressColor(catProgress)}">${catProgress}%</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value text-base">${catTotalTasks.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Selesai</div>
                <div class="stat-value text-base">${catFinish.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Sisa</div>
                <div class="stat-value text-base">${catRemaining.toLocaleString('id-ID')}</div>
              </div>
              <div class="stat-box">
                <div class="stat-label">Items</div>
                <div class="stat-value text-base">${items.length}</div>
              </div>
            </div>
            <div class="space-y-3">`;

        items.forEach((item, itemIdx) => {
          const itemProgress = Number(item.progress) || 0;
          html += `
            <div class="item-row" style="animation-delay: ${(idx * 0.1) + (itemIdx * 0.05)}s">
              <div class="flex justify-between mb-2">
                <span class="text-sm text-slate-300">${item.item}</span>
                <span class="text-sm font-semibold ${getProgressColor(itemProgress)}">${itemProgress.toFixed(2)}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${itemProgress}%"></div>
              </div>
              <div class="flex justify-between mt-1 text-xs text-slate-500">
                <span>${item.finish}/${item.totalTask}</span>
                <span>${item.remaining} sisa</span>
              </div>
            </div>`;
        });
        html += `</div></div>`;
        container.innerHTML += html;
      });
    }

    function renderHatsatDashboard() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      document.getElementById('overallSummaryTitle').classList.add('hidden');
      const statContainer = document.getElementById('summaryStatsContainer');
      statContainer.classList.add('hidden');
      document.getElementById('filtersContainer').classList.remove('hidden');

      // Get filter values
      const urgensiFilter = document.getElementById('urgensiFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;
      const materialFilter = document.getElementById('materialFilter').value;

      // Filter data based on selected filters
      let filteredData = hatsatData.filter(item => {
        let matches = true;
        if (urgensiFilter && item.urgensi !== urgensiFilter) matches = false;
        if (statusFilter && item.statusTPTR !== statusFilter) matches = false;
        if (materialFilter) {
          const materialStatus = getMaterialStatus(item.statusMaterial);
          if (materialStatus !== materialFilter) matches = false;
        }
        return matches;
      });

      const grouped = filteredData.reduce((acc, item) => {
        if (!acc[item.kategori]) acc[item.kategori] = [];
        acc[item.kategori].push(item);
        return acc;
      }, {});

      let summaryKategoriHtml = `
      <div class="flex items-center justify-between mb-4">

          <div>
              <h2 class="text-2xl font-bold text-slate-100">
                  Summary Function Test HAT/SAT
              </h2>

              <p class="text-slate-400 text-sm">
                  Ringkasan status Function Test berdasarkan kategori
              </p>
          </div>

      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4 mb-6">

      ${Object.keys(grouped).map(kategori => {

          const items = grouped[kategori];

          const closed =
              items.filter(i =>
                  i.statusFungsi === 'Close'
              ).length;

          const total =
              items.length;

          const progress =
              total > 0
                  ? ((closed / total) * 100).toFixed(1)
                  : 0;

          return `

              <div class="stat-box">

                  <div class="text-slate-300 text-sm font-semibold mb-2">
                      ${kategori}
                  </div>

                  <div class="
                      text-2xl font-bold
                      ${getProgressColor(progress)}
                  ">
                      ${progress}%
                  </div>

                  <div class="text-xs text-slate-500 mt-1">
                      ${closed}/${total} Close
                  </div>

                  <div class="progress-bar mt-3">

                      <div
                          class="progress-fill"
                          style="width:${progress}%"
                      ></div>

                  </div>

              </div>

          `;

      }).join('')}

      </div>

      `;  

      // If no results, show message
      if (Object.keys(grouped).length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-400"><p class="text-lg">Tidak ada data yang sesuai dengan filter yang dipilih</p></div>';
        return;
      }   

      container.innerHTML = summaryKategoriHtml;

      Object.keys(grouped).forEach((kategori, idx) => {
        const items = grouped[kategori];
        const closedCount = items.filter(i => i.statusFungsi === 'Close').length;
        const openedCount = items.filter(i => i.statusFungsi === 'Open').length;

        let html = `
          <div class="category-card" style="animation-delay: ${idx * 0.1}s">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-slate-100">${kategori}</h2>
              <div class="flex gap-2">
                <span class="text-sm px-3 py-1 rounded-full bg-green-500/20 border border-green-500 text-green-300">✓ ${closedCount}</span>
                <span class="text-sm px-3 py-1 rounded-full bg-yellow-500/20 border border-yellow-500 text-yellow-300">⚙ ${openedCount}</span>
              </div>
            </div>
            <div class="space-y-3">`;

        items.forEach((item, itemIdx) => {
          html += `
            <div class="item-row p-3 rounded-lg border border-slate-700 bg-slate-800/50" style="animation-delay: ${(idx * 0.1) + (itemIdx * 0.05)}s">
              <div class="flex items-start justify-between mb-2">
                <div class="flex-1">
                  <div class="font-semibold text-slate-100">${item.sistem}</div>
                  <div class="text-xs text-slate-400 mt-1">Inspeksi: ${item.inspeksi}</div>
                </div>
                <span class="px-2 py-1 rounded text-xs font-semibold ${getStatusColor(item.statusFungsi)} border">${item.statusFungsi}</span>
              </div>
              <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                <div>
                  <span class="text-slate-400">Urgensi:</span>
                  <span class="text-slate-200 ml-1 px-2 py-1 rounded inline-block ${item.urgensi === 'Prioritas' ? 'bg-red-500/20 text-red-300' : 'bg-blue-500/20 text-blue-300'}">${item.urgensi}</span>
                </div>
                <div>
                  <span class="text-slate-400">Rencana:</span>
                  <span class="text-slate-200 ml-1">${item.planDate}</span>
                </div>
                <div>
                  <span class="text-slate-400">Material:</span>
                  <span class="text-slate-200 ml-1 px-2 py-1 rounded inline-block bg-slate-700">${item.statusMaterial}</span>
                </div>
                <div>
                  <span class="text-slate-400">Dokumen TPTR:</span>
                  <span class="text-slate-200 ml-1 px-2 py-1 rounded inline-block bg-slate-700">${item.statusTPTR}</span>
                </div>
                <div>
                  <span class="text-slate-400">Keterangan:</span>
                  <span class="text-slate-200 ml-1">${item.keterangan}</span>
                </div>
              </div>
            </div>`;
        });
        html += `</div></div>`;
        container.innerHTML += html;
      });
    }

    function renderITPDashboard() {

        const container = document.getElementById('categoriesContainer');

        container.innerHTML = '';
        document.getElementById('overallSummaryTitle').classList.add('hidden');

        document.getElementById('summaryStatsContainer').classList.add('hidden');

        document.getElementById('filtersContainer').classList.add('hidden');

        if (itpData.length === 0) {

            container.innerHTML = `
                <div class="text-center py-10 text-slate-400">
                    Data ITP tidak tersedia
                </div>
            `;

            return;
        }

        const approvedCount =
            itpData.filter(i => i.status === 'Approved').length;

        const progressAvg =
            (
                itpData.reduce((a, b) => a + Number(b.progressDokumen || 0), 0)
                / itpData.length
            ).toFixed(1);

        let html = `
            <div class="mb-4">

                <h2 class="text-2xl font-bold text-slate-100">
                    Overall Status ITP
                </h2>

                <p class="text-sm text-slate-400 mt-1">
                    Monitoring progress approval Inspection Test Plan
                </p>

            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

                <div class="stat-box">
                    <div class="stat-label">Total Dokumen</div>
                    <div class="stat-value">
                        ${itpData.length}
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Approved</div>
                    <div class="stat-value percentage-high">
                        ${approvedCount}
                    </div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Average Progress</div>
                    <div class="stat-value text-cyan-300">
                        ${progressAvg}%
                    </div>
                </div>

            </div>

            <div class="category-card">

                <div class="flex items-center justify-between mb-6">

                    <div>
                        <h2 class="text-2xl font-bold text-slate-100">
                            Inspection Test Plan (ITP)
                        </h2>

                        <p class="text-slate-400 text-sm mt-1">
                            Monitoring progress approval dokumen inspeksi
                        </p>
                    </div>

                    <div class="px-4 py-2 rounded-xl bg-cyan-500/20 border border-cyan-500 text-cyan-300 font-bold">
                        ${progressAvg}%
                    </div>

                </div>

                <div class="space-y-4">
        `;

        itpData.forEach((item, index) => {

            const progress = Number(item.progressDokumen || 0);

            html += `
                <div class="item-row p-4 rounded-xl border border-slate-700 bg-slate-800/50">

                    <div class="flex items-center justify-between mb-3">

                        <div>
                            <h3 class="text-slate-100 font-semibold">
                                ${item.contents}
                            </h3>

                            <p class="text-xs text-slate-400 mt-1">
                                Status Dokumen
                            </p>
                        </div>

                        <div class="
                            px-3 py-1 rounded-lg text-xs font-semibold
                            ${item.status === 'Approved'
                                ? 'bg-green-500/20 text-green-300 border border-green-500'
                                : 'bg-yellow-500/20 text-yellow-300 border border-yellow-500'
                            }
                        ">
                            ${item.status}
                        </div>

                    </div>

                    <div class="progress-bar mb-2">
                        <div
                            class="progress-fill"
                            style="width:${progress}%"

                        <td class="py-3 text-slate-300">
                            ${item.kategori}
                        </td>

                        <td class="py-3 text-slate-300">
                            ${item.sistem}
                        </td>

                        <td class="py-3 text-slate-300">
                            ${item.inspeksi}
                        </td>

                        <td class="py-3 text-slate-300">
                            ${item.pic || '-'}
                        </td>

                        <td class="py-3">

                            <span class="
                                px-2 py-1 rounded
                                bg-yellow-500/20
                                border border-yellow-500
                                text-yellow-300
                                text-xs
                            ">
                                OPEN
                            </span>

                        </td>

                    </tr>

                `;
            });

        html += `
                        </tbody>
                    </table>

                </div>

            </div>
        `;

        container.innerHTML = html;
    }

    function getMaterialStatus(material) {

        if (!material) return '';

        material = material.toLowerCase();

        if (material.includes('masuk pal') || material.includes('selesai')) {
            return 'Masuk PAL';
        } else if (material.includes('proses')) {
            return 'Proses';
        } else if (material.includes('belum')) {
            return 'Belum Masuk';
        }

        return 'Selesai';
    }

    document.getElementById('dashboardSelector').addEventListener('change', (e) => {

        document.getElementById('filtersContainer').classList.add('hidden');

        if (e.target.value === 'summary') {

            renderSummaryDashboard();

        } else if (e.target.value === 'hatsat') {

            renderHatsatDashboard();

        } else if (e.target.value === 'qualityplan') {

            renderQualityPlanDashboard();
        } else if (e.target.value === 'tptr') {

            renderTPTRDashboard();
        } else if (e.target.value === 'material') {

            renderMaterialDashboard();
        } else if (e.target.value === 'launching') {

            renderLaunchingDashboard();

        } else {

            renderITPDashboard();
        }

        lucide.createIcons();
    });

    // Filter event listeners
    document.getElementById('urgensiFilter').addEventListener('change', renderHatsatDashboard);
    document.getElementById('statusFilter').addEventListener('change', renderHatsatDashboard);
    document.getElementById('materialFilter').addEventListener('change', renderHatsatDashboard);
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('urgensiFilter').value = '';
      document.getElementById('statusFilter').value = '';
      document.getElementById('materialFilter').value = '';
      renderHatsatDashboard();
    });
