<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warranty Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f5f7fa;
    padding:20px;
}

.header{
    margin-bottom:20px;
}

.header h1{
    color:#003366;
}

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#ddd;
}

.tab.active{
    background:#003366;
    color:white;
}

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    color:#666;
    font-size:14px;
}

.card .value{
    font-size:34px;
    font-weight:bold;
    color:#003366;
    margin-top:8px;
}

.section{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
    margin-bottom:15px;
    color:#003366;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

.progress{
    font-weight:bold;
    color:#0066cc;
}

.timeline{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.step{
    flex:1;
    min-width:100px;
    background:#eef4ff;
    text-align:center;
    padding:12px;
    border-radius:10px;
    font-weight:600;
}

.arrow{
    display:flex;
    align-items:center;
    font-size:22px;
}

#workflowContainer{

    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));

    gap:15px;
}

.workflow-card{

    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:12px;
    padding:15px;
}

.workflow-title{

    font-weight:600;
    color:#003366;
    margin-bottom:10px;
}

.workflow-value{

    font-size:20px;
    font-weight:bold;
}

.workflow-percent{

    color:#666;
    margin-top:5px;
    margin-bottom:10px;
}

.workflow-bar{

    height:10px;
    background:#e5e5e5;
    border-radius:20px;
    overflow:hidden;
}

.workflow-fill{

    height:100%;
    background:#1e88e5;
}

</style>
</head>

<body>

<div class="header">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
    ">

        <h1>Warranty Claim Dashboard</h1>

        <div style="
            text-align:right;
            color:#666;
            font-size:14px;
        ">
            <div>
                Last Update :
                <span id="lastUpdate">-</span>
            </div>

            <div>
                Refresh dalam :
                <span id="countdown">300</span> detik
            </div>
        </div>

    </div>
    

</div>

<div id="projectTabs" class="tabs"></div>

<div class="kpi-grid">

    <div class="card">
        <h3>Total Claim</h3>
        <div id="totalClaim" class="value">0</div>
    </div>

    <div class="card">
        <h3>Selesai</h3>
        <div id="completedClaim" class="value">0</div>
    </div>

    <div class="card">
        <h3>Dalam Proses</h3>
        <div id="openClaim" class="value">0</div>
    </div>

    <div class="card">
        <h3>Rata-rata Progress</h3>
        <div id="avgProgress" class="value">0%</div>
    </div>

</div>

<div class="section">
    <h2>Progress Keseluruhan Claim</h2>
    <canvas id="progressChart"></canvas>
</div>

<div class="section">
    <h2>Claim Dalam Proses</h2>

    <table>
        <thead>
            <tr>
                <th>Nama Claim</th>
                <th>Progress</th>
                <th>Plan Finish</th>
                <th>Keterangan</th>
            </tr>
        </thead>

        <tbody id="claimTable"></tbody>

    </table>

</div>

<div class="section">

    <h2>
        Ringkasan Tahapan Warranty Claim
    </h2>

    <div id="workflowContainer"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbx6UmU6VkWqgqoY0oGt_ZllZiJvDx_VJlzk7SesWrNSlkzLgoaerHbVN92Q1Oi3Kgo/exec";

let allData = [];
let chart;

let refreshInterval = 300; // 5 menit
let countdown = refreshInterval;

function updateLastUpdate(){

    const now = new Date();

    document.getElementById("lastUpdate").innerText =
        now.toLocaleString("id-ID");

}

async function loadData(){

    try{

         const res = await fetch(
            API + "?t=" + Date.now()
        );

        const result = await res.json();

        console.log(result);

        allData = result.summaryData || [];

        buildTabs();
        updateLastUpdate();

    }catch(err){

        console.error(err);

        alert("Gagal mengambil data");

    }

}

function buildTabs(){

    if(!allData.length){

        document.getElementById("projectTabs").innerHTML =
            "<h3>Tidak ada data</h3>";

        return;
    }

    const tabs =
        document.getElementById("projectTabs");

    const projects =
        [...new Set(
            allData.map(x=>x.proyek)
        )];

    tabs.innerHTML="";

    projects.forEach((project,index)=>{

        const btn =
            document.createElement("button");

        btn.className =
            index===0
            ? "tab active"
            : "tab";

        btn.innerText = project;

        btn.onclick=()=>{

            document
            .querySelectorAll(".tab")
            .forEach(t=>t.classList.remove("active"));

            btn.classList.add("active");

            renderProject(project);

        };

        tabs.appendChild(btn);

    });

    renderProject(projects[0]);

}

function renderProject(project){

    const data =
        allData.filter(
            x=>x.proyek===project
        );

    const total =
        data.length;

    const completed =
        data.filter(
            x=>x.progress>=100
        ).length;

    const open =
        total-completed;

    const avg =
        total
        ? (
            data.reduce(
                (a,b)=>a+b.progress,
                0
            ) / total
          ).toFixed(1)
        : 0;

    document.getElementById("totalClaim")
        .innerText = total;

    document.getElementById("completedClaim")
        .innerText = completed;

    document.getElementById("openClaim")
        .innerText = open;

    document.getElementById("avgProgress")
        .innerText = Number(avg).toFixed(2) + "%";

    renderChart(data);
    renderTable(data);
    renderWorkflow(data);

}

function renderChart(data){

    const ctx =
        document.getElementById("progressChart");

    if(chart)
        chart.destroy();

    chart = new Chart(ctx,{
        type:"bar",
        data:{
            labels:data.map(
                x=>x.namaClaim
            ),
            datasets:[{
                label:"Progress %",
                data:data.map(
                    x=>x.progress
                )
            }]
        },
        options:{
            responsive:true,
            scales:{
                y:{
                    beginAtZero:true,
                    max:100
                }
            }
        }
    });

}

function renderTable(data){

    const tbody =
        document.getElementById(
            "claimTable"
        );

    const openClaims =
        data.filter(
            x=>x.progress<100
        );

    tbody.innerHTML =
        openClaims.map(x=>`

        <tr>
            <td>${x.namaClaim}</td>
            <td class="progress">
                ${Number(x.progress).toFixed(2)}%
            </td>
            <td>${x.planFinish||"-"}</td>
            <td>${x.keterangan||"-"}</td>
        </tr>

        `).join("");

}

function renderWorkflow(data){

    const total = data.length;

    const stages = [
        {name:"Claim", field:"claim"},
        {name:"Q001", field:"q01"},
        {name:"Observation", field:"observation"},
        {name:"Q002", field:"q02"},
        {name:"Material", field:"jasaMaterial"},
        {name:"Install", field:"install"},
        {name:"Commissioning", field:"commisioning"},
        {name:"Testing", field:"testing"},
        {name:"Q003", field:"q03"}
    ];

    const html = stages.map(stage=>{

        const completed =
            data.filter(
                x => Number(x[stage.field]) >= 100
            ).length;

        const percent =
            total
            ? ((completed/total)*100).toFixed(2)
            : 0;

        return `

        <div class="workflow-card">

            <div class="workflow-title">
                ${stage.name}
            </div>

            <div class="workflow-value">
                ${completed}/${total}
            </div>

            <div class="workflow-percent">
                ${percent}%
            </div>

            <div class="workflow-bar">

                <div
                    class="workflow-fill"
                    style="width:${percent}%"
                ></div>

            </div>

        </div>

        `;

    }).join("");

    document.getElementById("workflowContainer").innerHTML =
        html;

}

setInterval(()=>{

    countdown--;

    document.getElementById("countdown")
        .innerText = countdown;

    if(countdown <= 0){

        countdown = refreshInterval;

        loadData();

    }

},1000);

loadData();

setInterval(()=>{

    loadData();

},300000);

</script>

</body>
</html>
