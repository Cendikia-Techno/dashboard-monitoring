<!doctype html>
<html lang="id" class="h-full">
 <head><script src="/_sdk/telemetry_sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warranty Claims Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .progress-bar { transition: width 0.6s ease; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .tab-active { border-bottom: 3px solid #0ea5e9; color: #0ea5e9; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full bg-slate-900 text-slate-100 overflow-auto">
   <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
    <div class="flex justify-between items-center">

        <div>
        <h1 id="main-title"
            class="text-2xl font-bold text-white">
            Warranty Claims Dashboard
        </h1>

        <p class="text-slate-400 text-sm mt-1">
            Monitoring progress klaim garansi per proyek
        </p>
        </div>

        <button
        onclick="loadData()"
        class="bg-sky-500 hover:bg-sky-600 px-4 py-2 rounded-lg text-white text-sm">
        Refresh Data
        </button>

    </div>
    </header>
   <nav id="project-tabs" class="bg-slate-800 px-6 flex gap-1 overflow-x-auto border-b border-slate-700"></nav>
   <main id="dashboard-content" class="p-6 space-y-6"></main>
  </div>
  <script>

let rawData = [];
let projects = {};
let projectNames = [];
let activeProject = '';

async function loadData() {
  try {

    document.getElementById('dashboard-content').innerHTML = `
      <div class="bg-slate-800 rounded-xl p-6 text-center border border-slate-700">
        <div class="animate-pulse text-slate-300">
          Loading data warranty claim...
        </div>
      </div>
    `;

    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbx6UmU6VkWqgqoY0oGt_ZllZiJvDx_VJlzk7SesWrNSlkzLgoaerHbVN92Q1Oi3Kgo/exec'
    );

    const data = await response.json();

    rawData = data.map(item => ({
      p: item.kategori,
      d: item.namaClaim,

      cm: Number(item.claim) || 0,
      q1: Number(item.q01) || 0,
      ob: Number(item.observation) || 0,
      q2: Number(item.q02) || 0,
      jm: Number(item.jasaMaterial) || 0,
      it: Number(item.install) || 0,
      co: Number(item.commisioning) || 0,
      te: Number(item.testing) || 0,
      q3: Number(item.q03) || 0,

      pr: Number(item.progress) || 0,

      planStart: item.planStart || '',
      planFinish: item.planFinish || '',
      actualStart: item.actualStart || '',
      actualFinish: item.actualFinish || '',
      keterangan: item.keterangan || ''
    }));

    buildProjects();

  } catch (error) {

    console.error(error);

    document.getElementById('dashboard-content').innerHTML = `
      <div class="bg-red-900/20 border border-red-500 rounded-xl p-6 text-center">
        <p class="text-red-300 font-semibold">
          Gagal mengambil data dari Apps Script
        </p>
        <p class="text-red-200 text-sm mt-2">
          ${error.message}
        </p>
      </div>
    `;
  }
}

setInterval(() => {
  loadData();
}, 60000);

function buildProjects() {

  projects = {};

  rawData.forEach(r => {

    if (!projects[r.p]) {
      projects[r.p] = [];
    }

    projects[r.p].push(r);

  });

  projectNames = Object.keys(projects);

  if (projectNames.length > 0) {
    activeProject = projectNames[0];
  }

  renderTabs();
  renderDashboard();
}

const defaultConfig = {
  dashboard_title: "Warranty Claims Dashboard",
  background_color: "#0f172a",
  surface_color: "#1e293b",
  text_color: "#e2e8f0",
  primary_color: "#0ea5e9",
  secondary_color: "#64748b"
};

function renderTabs() {
  const nav = document.getElementById('project-tabs');
  nav.innerHTML = projectNames.map(name => `
    <button onclick="switchProject('${name}')" class="px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors ${name === activeProject ? 'tab-active text-sky-400' : 'text-slate-400 hover:text-slate-200'}">
      ${name}
    </button>
  `).join('');
}

function switchProject(name) {
  activeProject = name;
  renderTabs();
  renderDashboard();
}
window.switchProject = switchProject;

function renderDashboard() {
  const data = projects[activeProject];
  const total = data.length;
  const completed = data.filter(r => r.pr === 100).length;
  const inProgress = data.filter(r => r.pr > 0 && r.pr < 100).length;
  const avgProgress = (data.reduce((s, r) => s + r.pr, 0) / total).toFixed(1);
  const claimPending = data.filter(r => r.cm === 0).length;

  const content = document.getElementById('dashboard-content');
  content.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card-hover bg-slate-800 rounded-xl p-5 border border-slate-700">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-sky-500/20 flex items-center justify-center"><i data-lucide="file-text" class="w-5 h-5 text-sky-400"></i></div>
          <span class="text-slate-400 text-sm">Total Klaim</span>
        </div>
        <p class="text-3xl font-bold text-white">${total}</p>
      </div>
      <div class="card-hover bg-slate-800 rounded-xl p-5 border border-slate-700">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center"><i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i></div>
          <span class="text-slate-400 text-sm">Selesai</span>
        </div>
        <p class="text-3xl font-bold text-emerald-400">${completed}</p>
      </div>
      <div class="card-hover bg-slate-800 rounded-xl p-5 border border-slate-700">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-amber-500/20 flex items-center justify-center"><i data-lucide="clock" class="w-5 h-5 text-amber-400"></i></div>
          <span class="text-slate-400 text-sm">Dalam Proses</span>
        </div>
        <p class="text-3xl font-bold text-amber-400">${inProgress}</p>
      </div>
      <div class="card-hover bg-slate-800 rounded-xl p-5 border border-slate-700">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-violet-500/20 flex items-center justify-center"><i data-lucide="trending-up" class="w-5 h-5 text-violet-400"></i></div>
          <span class="text-slate-400 text-sm">Rata-rata Progress</span>
        </div>
        <p class="text-3xl font-bold text-violet-400">${avgProgress}%</p>
      </div>
    </div>

    <!-- Progress Overview Bar -->
    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
      <h3 class="text-lg font-semibold text-white mb-3">Progress Keseluruhan</h3>
      <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden">
        <div class="progress-bar h-full rounded-full bg-gradient-to-r from-sky-500 to-emerald-400" style="width:${avgProgress}%"></div>
      </div>
      <div class="flex justify-between mt-2 text-xs text-slate-400">
        <span>${completed} selesai dari ${total} klaim</span>
        <span>${avgProgress}%</span>
      </div>
    </div>

    <!-- Claims needing attention -->
    ${inProgress > 0 ? `
    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
      <h3 class="text-lg font-semibold text-white mb-4"><i data-lucide="alert-circle" class="w-5 h-5 inline text-amber-400 mr-2"></i>Klaim Dalam Proses</h3>
      <div class="space-y-3">
        ${data.filter(r => r.pr < 100).map(r => `
          <div class="bg-slate-750 rounded-lg p-4 border border-slate-600">
            <div class="flex justify-between items-start mb-2">
              <div class="flex-1 mr-4">
                <p class="text-sm text-slate-200 font-medium">
                    ${r.d}
                </p>

                <div class="text-xs text-slate-400 mt-2">

                    ${r.planStart ? `
                    <div>Plan Start : ${r.planStart}</div>
                    ` : ''}

                    ${r.planFinish ? `
                    <div>Plan Finish : ${r.planFinish}</div>
                    ` : ''}

                    ${r.actualStart ? `
                    <div>Actual Start : ${r.actualStart}</div>
                    ` : ''}

                    ${r.actualFinish ? `
                    <div>Actual Finish : ${r.actualFinish}</div>
                    ` : ''}

                    ${r.keterangan ? `
                    <div class="mt-1 text-amber-300">
                        ${r.keterangan}
                    </div>
                    ` : ''}

                </div>
                </div>
              <span class="text-xs font-bold px-2 py-1 rounded ${r.pr >= 80 ? 'bg-amber-500/20 text-amber-300' : r.pr >= 60 ? 'bg-orange-500/20 text-orange-300' : 'bg-red-500/20 text-red-300'}">${r.pr.toFixed(1)}%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
              <div class="progress-bar h-full rounded-full ${r.pr >= 80 ? 'bg-amber-400' : r.pr >= 60 ? 'bg-orange-400' : 'bg-red-400'}" style="width:${r.pr}%"></div>
            </div>
            <div class="flex gap-2 mt-2 flex-wrap">
              ${r.cm === 0 ? '<span class="text-xs bg-red-900/40 text-red-300 px-2 py-0.5 rounded">Claim Belum Masuk</span>' : ''}
              ${r.te === 0 ? '<span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Testing Pending</span>' : ''}
              ${r.q3 === 0 ? '<span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Q003 Pending</span>' : ''}
              ${r.co === 0 ? '<span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Commissioning Pending</span>' : ''}
              ${r.it === 0 ? '<span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Instalasi Pending</span>' : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : `
    <div class="bg-emerald-900/20 border border-emerald-700 rounded-xl p-6 text-center">
      <i data-lucide="check-circle" class="w-12 h-12 text-emerald-400 mx-auto mb-3"></i>
      <p class="text-emerald-300 font-semibold text-lg">Semua klaim telah selesai!</p>
    </div>`}

    <!-- Step Progress Summary -->
    <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">
      <h3 class="text-lg font-semibold text-white mb-4">Ringkasan Tahapan</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3">
        ${[
          {label:'Claim Masuk',key:'cm'},{label:'Dok. Q001',key:'q1'},{label:'Observation',key:'ob'},
          {label:'Dok. Q002',key:'q2'},{label:'Jasa/Material',key:'jm'},{label:'Instalasi',key:'it'},
          {label:'Commissioning',key:'co'},{label:'Testing',key:'te'},{label:'Dok. Q003',key:'q3'}
        ].map(step => {
          const done = data.filter(r => r[step.key] === 100).length;
          const pct = ((done/total)*100).toFixed(0);
          return `<div class="bg-slate-750 rounded-lg p-3 border border-slate-600 text-center">
            <p class="text-xs text-slate-400 mb-1">${step.label}</p>
            <p class="text-xl font-bold ${pct == 100 ? 'text-emerald-400' : 'text-sky-400'}">${done}/${total}</p>
            <p class="text-xs text-slate-500">${pct}%</p>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  lucide.createIcons();
}

// Element SDK init
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    document.getElementById('main-title').textContent = config.dashboard_title || defaultConfig.dashboard_title;
    const app = document.getElementById('app');
    app.style.backgroundColor = config.background_color || defaultConfig.background_color;
    app.style.color = config.text_color || defaultConfig.text_color;
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({background_color:v}); }},
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({surface_color:v}); }},
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({text_color:v}); }},
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({primary_color:v}); }},
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({secondary_color:v}); }},
    ],
    borderables: [],
    fontEditable: undefined,
    fontSizeable: undefined
  }),
  mapToEditPanelValues: (config) => new Map([
    ["dashboard_title", config.dashboard_title || defaultConfig.dashboard_title]
  ])
});

loadData();
</script>

</html>
