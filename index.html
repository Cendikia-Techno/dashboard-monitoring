<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Project</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      text-align:center;
    }

    h1{
      margin-bottom:40px;
      color:#1f2937;
    }

    .card-wrapper{
      display:flex;
      gap:30px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .card{
      width:250px;
      padding:30px;
      border-radius:15px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
      cursor:pointer;
      text-decoration:none;
      color:#111827;
    }

    .card:hover{
      transform:translateY(-5px);
      background:#2563eb;
      color:white;
    }

    .project-title{
      font-size:24px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .desc{
      font-size:14px;
      opacity:0.8;
    }

    footer{
    position:fixed;
    bottom:15px;
    width:100%;
    text-align:center;
    font-size:14px;
    color:#6b7280;
    font-weight:500;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>QA DASHBOARD</h1>

    <div class="card-wrapper">

      <a href="frigate1.html" class="card">
        <div class="project-title">FRIGATE</div>
        <div class="desc">
          Dashboard monitoring proyek frigate
        </div>
      </a>

      <a href="ldp1.html" class="card">
        <div class="project-title">LDP</div>
        <div class="desc">
          Dashboard monitoring proyek LDP
        </div>
      </a>

    </div>
  </div>
  <footer>
    Created by Quality Engineer - Allif C
  </footer>

</body>
</html>
