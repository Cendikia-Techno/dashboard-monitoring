<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QA Project Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:
      linear-gradient(rgba(15,23,42,0.92), rgba(15,23,42,0.96)),
      url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      min-height:100vh;
      color:white;
    }

    /* HEADER */

    .header{
      width:100%;
      padding:25px 60px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
    }

    .logo-area{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .logo{
      width:55px;
      height:55px;
      border-radius:14px;
      background:#2563eb;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:24px;
      font-weight:bold;
      box-shadow:0 4px 15px rgba(37,99,235,0.4);
    }

    .company-text h2{
      font-size:22px;
      letter-spacing:1px;
    }

    .company-text p{
      font-size:13px;
      opacity:0.7;
      margin-top:3px;
    }

    /* MAIN */

    .main{
      max-width:1300px;
      margin:auto;
      padding:50px 20px 80px;
    }

    .title{
      text-align:center;
      margin-bottom:50px;
    }

    .title h1{
      font-size:46px;
      margin-bottom:12px;
    }

    .title p{
      font-size:17px;
      opacity:0.75;
    }

    /* SECTION */

    .section-box{
      margin-bottom:50px;
    }

    .section-title{
      font-size:26px;
      font-weight:bold;
      margin-bottom:25px;
      padding-left:5px;
    }

    /* CARD */

    .card-wrapper{
      display:flex;
      flex-wrap:wrap;
      gap:22px;
    }

    .card{
      width:220px;
      height:180px;
      border-radius:24px;
      text-decoration:none;
      color:white;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      transition:0.3s ease;
      box-shadow:0 8px 25px rgba(0,0,0,0.25);
    }

    .card:hover{
      transform:translateY(-8px);
      background:rgba(37,99,235,0.25);
      border:1px solid rgba(255,255,255,0.18);
    }

    .icon{
      font-size:52px;
      margin-bottom:18px;
    }

    .project-title{
      font-size:20px;
      font-weight:bold;
      text-align:center;
      padding:0 10px;
      line-height:1.4;
    }

    /* FOOTER */

    footer{
      text-align:center;
      padding:22px;
      font-size:14px;
      color:rgba(255,255,255,0.7);
      border-top:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(6px);
    }

    footer span{
      color:#60a5fa;
      font-weight:bold;
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      .header{
        padding:20px;
      }

      .title h1{
        font-size:34px;
      }

      .card-wrapper{
        justify-content:center;
      }

      .card{
        width:160px;
        height:150px;
      }

      .icon{
        font-size:40px;
      }

      .project-title{
        font-size:16px;
      }

    }

  </style>
</head>

<body>

    <div class="logo-area">

      <div class="logo">
        QA
      </div>

      <div class="company-text">

    const container = document.getElementById("dashboardContainer");

    function createDashboard(){

    let html = "";

    sections.forEach(section => {

        html += `
        <div class="section-box">

            <div class="section-title">
            ${section.title}
            </div>

            <div class="card-wrapper">
        `;

        section.cards.forEach(card => {

        html += `
            <a
            href="${card.link}"
            class="card"
            ${section.external ? 'target="_blank"' : ''}
            >

            <div class="icon">
                ${section.icon}
            </div>

            <div class="project-title">
                ${card.name}
            </div>

            </a>
        `;

        });

        html += `
            </div>

        </div>
        `;

    });

    container.innerHTML = html;

    }

    createDashboard();
