<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRI 404 - QA Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            color: #1d3557;
        }

        select {

            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;

        }

        .cards {

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;

        }

        .card {

            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        .card h3 {

            color: #888;
            font-size: 14px;
            margin-bottom: 10px;

        }

        .card h2 {

            color: #1d3557;
            font-size: 32px;

        }

        .content {

            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;

        }

        .panel {

            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        table {

            width: 100%;
            border-collapse: collapse;

        }

        th {

            background: #1d3557;
            color: white;
            padding: 12px;

        }

        td {

            padding: 12px;
            border-bottom: 1px solid #eee;

        }

        .progress {

            width: 100%;
            height: 18px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;

        }

        .progress div {

            height: 100%;
            background: #2ecc71;

        }

        .hero-links {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 16px;

        }

        .hero-link {

            display: flex;

        }

        .hero-link a {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            background: #ffffff;

            border: 1px solid #dbe4f0;

            color: #0d6efd;

            font-weight: 600;

            transition: .25s;

        }

        .hero-link a:hover {

            background: #0d6efd;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(13, 110, 253, .25);

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>QA Dashboard - TCM KRI ARGODEDALI 404</h1>

            <select id="docType">

                <option value="itp">Inspection Test Plan</option>

                <option value="qplan">Quality Plan</option>

            </select>
            <br>
            <div class="hero-link">
                <a href="https://docs.google.com/spreadsheets/d/15eN8IbwBSC1Fja3Vvgfdo-_209HlSyAqkLxYsIYKGOo/edit?gid=0#gid=0"
                    target="_blank" rel="noopener noreferrer">

                    <i class="fa-solid fa-chart-simple"></i>

                    Inspeksi Status

                    <i class="fa-solid fa-arrow-up-right-from-square"></i>

                </a>
            </div>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Progress</h3>

                <h2 id="overallProgress">0%</h2>

            </div>

            <div class="card">

                <h3>Selesai</h3>

                <h2 id="doneCount">0</h2>

            </div>

            <div class="card">

                <h3>Review</h3>

                <h2 id="reviewCount">0</h2>

            </div>

            <div class="card">

                <h3>Belum</h3>

                <h2 id="pendingCount">0</h2>

            </div>

        </div>

        <div class="content">

            <div class="panel">

                <h2 style="margin-bottom:20px;">Detail Progress</h2>

                <table>

                    <thead>

                        <tr>

                            <th width="50%">Section</th>

                            <th>Status</th>

                            <th width="30%">Progress</th>

                        </tr>

                    </thead>

                    <tbody id="tableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>
        const API_URL =
            "https://script.google.com/macros/s/AKfycbyIsio7Z9k5hTTKFtIDRvq0kBjAkEN1VFZBd1lWqjUAcExvJj06KGiQOEYEj6iqN48HpQ/exec";

        let dashboardData = {};
        loadData();

        async function loadData() {

            try {

                const response = await fetch(API_URL);

                dashboardData = await response.json();

                renderDashboard("itp");

            } catch (error) {

                console.error(error);

                alert("Gagal mengambil data.");

            }

        }

        function renderDashboard(type) {

            let data = [];

            if (type === "itp") {

                data = dashboardData.itpData;

            } else {

                data = dashboardData.qplanData;

            }

            renderSummary(data);

            renderTable(data);

        }

        function renderSummary(data) {

            const total = data.length;

            const selesai =
                data.filter(x => x.status === "Selesai").length;

            const review =
                data.filter(x => x.status === "Review").length;

            const belum =
                data.filter(x => x.status === "Belum").length;

            const progress =
                Math.round(

                    data.reduce((a, b) => a + b.progress, 0) / total

                );

            document.getElementById("overallProgress").innerHTML =
                progress + "%";

            document.getElementById("doneCount").innerHTML =
                selesai;

            document.getElementById("reviewCount").innerHTML =
                review;

            document.getElementById("pendingCount").innerHTML =
                belum;

        }

        function renderTable(data) {

            let html = "";

            data.forEach(item => {

                html += `

            <tr>

                <td>${item.section}</td>

                <td>${item.status}</td>

                <td>

                    <div class="progress">

                        <div style="width:${item.progress}%"></div>

                    </div>

                    ${item.progress}%

                </td>

            </tr>

            `;

            });

            document.getElementById("tableBody").innerHTML =
                html;

        }

        document
            .getElementById("docType")
            .addEventListener("change", function () {

                renderDashboard(this.value);

            });


    </script>

</body>

</html>
