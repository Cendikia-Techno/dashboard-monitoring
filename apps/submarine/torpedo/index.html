<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TORPEDO - QA Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 30px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            color: #1d3557;
        }

        select {

            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;

        }

        .cards {

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;

        }

        .card {

            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        .card h3 {

            color: #888;
            font-size: 14px;
            margin-bottom: 10px;

        }

        .card h2 {

            color: #1d3557;
            font-size: 32px;

        }

        .content {

            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;

        }

        .panel {

            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        table {

            width: 100%;
            border-collapse: collapse;

        }

        th {

            background: #1d3557;
            color: white;
            padding: 12px;

        }

        td {

            padding: 12px;
            border-bottom: 1px solid #eee;

        }

        .progress {

            width: 100%;
            height: 18px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;

        }

        .progress div {

            height: 100%;
            background: #2ecc71;

        }

        .hero-links {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 16px;

        }

        .hero-link {

            display: flex;

        }

        .hero-link a {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            background: #ffffff;

            border: 1px solid #dbe4f0;

            color: #0d6efd;

            font-weight: 600;

            transition: .25s;

        }

        .hero-link a:hover {

            background: #0d6efd;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(13, 110, 253, .25);

        }
    </style>

</head>

<body>
    <div class="container">

        <div class="header">

            <h1>QA Dashboard - TORPEDO</h1>

            <select id="docType">

                <option value="itp">Inspection Test Plan</option>

                <option value="qplan">Quality Plan</option>

                <option value="summary">Summary Inspection</option>

            </select>
            <br>
            <div class="hero-link">
                <a href="https://docs.google.com/spreadsheets/d/1hEXdIeFHAazSqArBYn8mBo3mU-_G6ClAIKQDvafx428/edit?gid=448101175#gid=448101175"
                    target="_blank" rel="noopener noreferrer">

                    <i class="fa-solid fa-chart-simple"></i>

                    Inspeksi Status

                    <i class="fa-solid fa-arrow-up-right-from-square"></i>

                </a>
            </div>


        </div>

        <div id="typeFilterContainer" style="display:none;margin-bottom:20px;">

            <label style="font-weight:600;margin-right:10px;">
                Type Torpedo
            </label>

            <select id="typeFilter">

            </select>

        </div>

        <div class="cards" id="cardsContainer">

            <div class="card">

                <h3>Progress</h3>

                <h2 id="overallProgress">0%</h2>

            </div>

            <div class="card">

                <h3>Selesai</h3>

                <h2 id="doneCount">0</h2>

            </div>

            <div class="card">

                <h3>Review</h3>

                <h2 id="reviewCount">0</h2>

            </div>

            <div class="card">

                <h3>Belum</h3>

                <h2 id="pendingCount">0</h2>

            </div>

        </div>

        <div class="content">
            <div class="panel">

                <h2 style="margin-bottom:20px;">

                    Progress by Category

                </h2>

                <div id="categoryProgress"></div>

            </div>

            <div class="panel">

                <h2 id="tableTitle" style="margin-bottom:20px;">Detail Progress</h2>

                <div id="tableBody"></div>

            </div>

        </div>

    </div>



    <script>
        const API_URL =
            "https://script.google.com/macros/s/AKfycbwW07SJ5jyOTSmohhUTbDFeFNsElCvnL-wOAEJzeYOtqYjB6jVLeeZ008RNFKJ-dlyI/exec";

        let dashboardData = {};
        let summaryFilteredData = [];
        loadData();

        async function loadData() {

            try {

                const response = await fetch(API_URL);

                dashboardData = await response.json();

                renderDashboard("itp");

            } catch (error) {

                console.error(error);

                alert("Gagal mengambil data.");

            }

        }

        function renderDashboard(type) {

            document
                .getElementById("typeFilterContainer")
                .style.display = "none";

            if (type === "itp") {

                renderSummary(dashboardData.itpData);

                renderTable(dashboardData.itpData);

            }

            else if (type === "qplan") {

                renderSummary(dashboardData.qplanData);

                renderTable(dashboardData.qplanData);

            }

            else if (type === "summary") {

                renderSummaryInspection();

            }

        }

        function renderSummaryInspection() {

            document
                .getElementById("typeFilterContainer")
                .style.display = "block";

            loadTypeFilter();

            const selectedType =
                document.getElementById("typeFilter").value || "All";

            filterSummaryData(selectedType);

            refreshSummaryDashboard();

        }

        function loadTypeFilter() {

            const select =
                document.getElementById("typeFilter");

            select.innerHTML = "";

            // Option All
            select.innerHTML +=
                `<option value="All">All</option>`;

            // Ambil type unik
            const types =
                [...new Set(
                    dashboardData.summaryData.map(x => x.type)
                )];

            types.forEach(type => {

                select.innerHTML +=
                    `<option value="${type}">${type}</option>`;

            });

        }

        function getSummaryStat(data) {

            const totalTask =
                data.reduce((sum, item) =>
                    sum + item.totalTask, 0);

            const finish =
                data.reduce((sum, item) =>
                    sum + item.finish, 0);

            const remaining =
                data.reduce((sum, item) =>
                    sum + item.remaining, 0);

            const progress =
                totalTask
                    ? (finish / totalTask) * 100
                    : 0;

            return {

                totalTask,

                finish,

                remaining,

                progress

            };

        }

        function renderCards(cards) {

            let html = "";

            cards.forEach(card => {

                html += `

            <div class="card">

                <h3>${card.title}</h3>

                <h2>${card.value}</h2>

            </div>

            `;

            });

            document
                .getElementById("cardsContainer")
                .innerHTML = html;

        }

        function getCategorySummary(data) {

            const result = {};

            data.forEach(item => {

                if (!result[item.kategori]) {

                    result[item.kategori] = {

                        totalTask: 0,

                        finish: 0,

                        remaining: 0

                    };

                }

                result[item.kategori].totalTask += item.totalTask;

                result[item.kategori].finish += item.finish;

                result[item.kategori].remaining += item.remaining;

            });

            return result;

        }

        function renderSummaryTable(data) {

            let html = `
        <table>

            <thead>

                <tr>

                    <th>Category</th>
                    <th>Item</th>
                    <th>Total</th>
                    <th>Completed</th>
                    <th>Remaining</th>
                    <th width="25%">Progress</th>

                </tr>

            </thead>

            <tbody>
        `;

            data.forEach(item => {

                html += `

            <tr>

                <td>${item.kategori}</td>

                <td>${item.item || "-"}</td>

                <td style="text-align:center">
                    ${item.totalTask}
                </td>

                <td style="text-align:center">
                    ${item.finish}
                </td>

                <td style="text-align:center">
                    ${item.remaining}
                </td>

                <td>

                    <div class="progress">

                        <div style="
                            width:${item.progress}%;
                            background:${getProgressColor(item.progress)};
                        ">

                        </div>

                    </div>

                    ${item.progress.toFixed(1)}%

                </td>

            </tr>

            `;

            });

            html += `

            </tbody>

        </table>
        `;

            document.getElementById("tableBody").innerHTML = html;

        }

        function renderCategoryProgress(data) {

            const summary =
                getCategorySummary(data);

            let html = "";

            Object.keys(summary).forEach(category => {

                const item = summary[category];

                const progress =
                    item.totalTask
                        ? (item.finish / item.totalTask) * 100
                        : 0;

                html += `

            <div style="margin-bottom:20px;">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    margin-bottom:6px;
                    font-weight:600;">

                    <span>${category}</span>

                    <span>${progress.toFixed(1)}%</span>

                </div>

                <div class="progress">

                    <div style="width:${progress}%;background:${getProgressColor(progress)};">

                    </div>

                </div>

                <div style="
                    margin-top:5px;
                    color:#777;
                    font-size:13px;">

                    ${item.finish} / ${item.totalTask} Task

                </div>

            </div>

            `;

            });

            document
                .getElementById("categoryProgress")
                .innerHTML = html;

        }

        function filterSummaryData(type) {

            if (type === "All") {

                summaryFilteredData =
                    dashboardData.summaryData;

            } else {

                summaryFilteredData =
                    dashboardData.summaryData.filter(
                        item => item.type === type
                    );

            }

        }

        function renderSummary(data) {

            const total = data.length;

            const selesai =
                data.filter(x => x.status === "Selesai").length;

            const review =
                data.filter(x => x.status === "Review").length;

            const belum =
                data.filter(x => x.status === "Belum").length;

            const progress =
                Math.round(

                    data.reduce((a, b) => a + b.progress, 0) / total

                );

            renderCards([

                {

                    title: "Progress",

                    value: progress + "%"

                },

                {

                    title: "Selesai",

                    value: selesai

                },

                {

                    title: "Review",

                    value: review

                },

                {

                    title: "Belum",

                    value: belum

                }

            ]);

        }

        function renderTable(data) {

            let html = `

        <table>

        <thead>

        <tr>

            <th width="50%">Section</th>

            <th>Status</th>

            <th width="30%">Progress</th>

        </tr>

        </thead>

        <tbody>

        `;

            data.forEach(item => {

                html += `

            <tr>

                <td>${item.section}</td>

                <td>${item.status}</td>

                <td>

                    <div class="progress">

                        <div style="width:${item.progress}%"></div>

                    </div>

                    ${item.progress}%

                </td>

            </tr>

            `;

            });

            html += `

        </tbody>

        </table>

        `;

            document.getElementById("tableTitle").innerHTML =
                "Detail Progress";

            document.getElementById("tableBody").innerHTML =
                html;

        }

        function getProgressColor(progress) {

            if (progress >= 75) return "#2ecc71";   // hijau

            if (progress >= 50) return "#3498db";   // biru

            if (progress >= 25) return "#f39c12";   // oranye

            return "#e74c3c";                    // merah
        }

        function refreshSummaryDashboard() {

            const stat = getSummaryStat(summaryFilteredData);

            renderCards([

                {
                    title: "Total Task",
                    value: stat.totalTask
                },

                {
                    title: "Completed",
                    value: stat.finish
                },

                {
                    title: "Remaining",
                    value: stat.remaining
                },

                {
                    title: "Progress",
                    value: stat.progress.toFixed(2) + "%"
                }

            ]);

            renderCategoryProgress(summaryFilteredData);

            renderSummaryTable(summaryFilteredData);

            document.getElementById("tableTitle").innerHTML =
                "Inspection Summary";

        }

        document
            .getElementById("docType")
            .addEventListener("change", function () {

                renderDashboard(this.value);

            });

        document
            .getElementById("typeFilter")
            .addEventListener("change", function () {

                filterSummaryData(this.value);
                refreshSummaryDashboard();

            });


    </script>

</body>

</html>
