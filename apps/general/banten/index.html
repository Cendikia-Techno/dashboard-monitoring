<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Inspection & Testing HPH No.2 PLTU Banten 2 Labuan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --corp-navy: #002855;
      --corp-yellow: #FFD100;
    }
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background-color: var(--corp-navy); border-bottom: 4px solid var(--corp-yellow); }
    .navbar-brand { color: var(--corp-yellow) !important; font-weight: bold; letter-spacing: 1px; font-size: 1.05rem; }
    
    .summary-card {
      background-color: white;
      border-radius: 8px;
      border-left: 5px solid var(--corp-navy);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .summary-title { font-size: 0.9rem; color: #6c757d; font-weight: bold; text-transform: uppercase;}
    .summary-value { font-size: 2rem; font-weight: bold; color: var(--corp-navy);}
    
    .table th { background-color: #002855 !important; color: white !important; text-align: center; vertical-align: middle;}
    .badge-completed { background-color: #198754; color: white; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem;}
    .badge-progress { background-color: #ffc107; color: black; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem;}
    .badge-notstarted { background-color: #6c757d; color: white; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem;}
    
    #loading { text-align: center; margin: 50px 0; font-weight: bold; color: var(--corp-navy); }
  </style>
</head>
<body>
  
  <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#"><i class="fa-solid fa-clipboard-check me-2"></i>DASHBOARD INSPECTION HPH NO.2 PLTU BANTEN 2 LABUAN</a>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">
    
    <div id="loading">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Mengambil data dari server Google Sheets...</p>
    </div>

    <div id="dashboard-content" style="display: none;">
      <!-- Row Summary Cards -->
      <div class="row mb-4">
        <div class="col-md-4 mb-3">
          <div class="summary-card" style="border-left-color: #0d6efd;">
            <div class="summary-title">Total Item Inspeksi</div>
            <div class="summary-value" id="totItems">0</div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="summary-card" style="border-left-color: #198754;">
            <div class="summary-title">Inspeksi Selesai (Completed)</div>
            <div class="summary-value" id="totCompleted">0</div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="summary-card" style="border-left-color: #ffc107;">
            <div class="summary-title">Rata-Rata Progress Keseluruhan</div>
            <div class="summary-value" id="totAvgProgress">0%</div>
            <div class="progress mt-2" style="height: 10px;">
              <div id="barProgress" class="progress-bar bg-warning" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- DataTables -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="table-responsive">
            <table id="dataTable" class="table table-bordered table-hover w-100">
              <thead>
                <tr>
                  <th style="width: 5%">No</th>
                  <th>Kategori Pekerjaan</th>
                  <th>Sub Pekerjaan / Inspeksi</th>
                  <th style="width: 15%">Status</th>
                  <th style="width: 25%">Progress</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbziSyang4qCBFhlNkjyBCyHsZJcxMr29ge8t942p_h-2VJAVlq-6pMOvc6e51fmB2nU_g/exec"; 

    $(document).ready(function() {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert("Error: " + data.error);
            return;
          }
          renderDashboard(data);
        })
        .catch(error => {
          console.error("Gagal fetch API:", error);
          $('#loading').html('<span class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Koneksi ke database gagal. Pastikan URL Apps Script benar dan sudah di-deploy dengan akses "Anyone".</span>');
        });
    });

    function renderDashboard(response) {
      $('#loading').hide();
      $('#dashboard-content').fadeIn();

      $('#totItems').text(response.summary.total_items);
      $('#totCompleted').text(response.summary.completed_items);
      $('#totAvgProgress').text(response.summary.avg_progress + '%');
      $('#barProgress').css('width', response.summary.avg_progress + '%');

      function formatStatus(status) {
        let text = status ? status.toString().trim() : "";
        let lower = text.toLowerCase();
        if(lower === 'completed' || lower === 'closed') {
          return `<span class="badge-completed">${text}</span>`;
        } else if(lower === 'in progress') {
          return `<span class="badge-progress">${text}</span>`;
        } else {
          return `<span class="badge-notstarted">${text || 'Not Started'}</span>`;
        }
      }

      function formatProgressBar(val) {
        let num = parseFloat(val) || 0;
        return `
          <div class="d-flex align-items-center">
            <span class="me-2 fw-bold" style="min-width: 45px;">${num}%</span>
            <div class="progress flex-grow-1" style="height: 12px;">
              <div class="progress-bar bg-primary" role="progressbar" style="width: ${num}%" aria-valuenow="${num}" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
          </div>
        `;
      }

      $('#dataTable').DataTable({
        data: response.items,
        columns: [
          { data: 'no', className: "text-center" },
          { data: 'kategori' },
          { data: 'sub' },
          { data: 'status', className: "text-center", render: formatStatus },
          { data: 'progress', render: formatProgressBar }
        ],
        pageLength: 30,
        ordering: false,
        language: { 
          search: "Cari Data:",
          lengthMenu: "Tampilkan _MENU_ data per halaman",
          zeroRecords: "Data tidak ditemukan",
          info: "Menampilkan halaman _PAGE_ dari _PAGES_",
          infoEmpty: "Tidak ada data tersedia",
          infoFiltered: "(disaring dari _MAX_ total data)"
        }
      });
    }
  </script>
</body>
</html>
