<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Penstock PLTA Ketenger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

  <style>
    :root {
      --corp-navy: #002855;
      --corp-yellow: #FFD100;
    }

    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background-color: var(--corp-navy);
      border-bottom: 4px solid var(--corp-yellow);
    }

    .navbar-brand {
      color: var(--corp-yellow) !important;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .summary-card {
      background-color: white;
      border-radius: 8px;
      border-left: 5px solid var(--corp-navy);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .summary-title {
      font-size: 0.9rem;
      color: #6c757d;
      font-weight: bold;
      text-transform: uppercase;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--corp-navy);
    }

    .table th {
      background-color: #002855 !important;
      color: white !important;
      text-align: center;
      vertical-align: middle;
    }

    .badge-closed {
      background-color: #198754;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .badge-proses {
      background-color: #ffc107;
      color: black;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Loading overlay */
    #loading {
      text-align: center;
      margin: 50px 0;
      font-weight: bold;
      color: var(--corp-navy);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">DASHBOARD PROGRESS REVITALISASI PENSTOCK PLTA KETENGER</a>
      <br>
      <a href="https://docs.google.com/spreadsheets/d/1S8PQrA757mnxglV2hS_MHctJnABzxpaqtISE8xtNfxc/edit?usp=drive_link"
        target="_blank" rel="noopener noreferrer">

        <i class="fa-solid fa-chart-simple"></i>

        Inspeksi Status

        <i class="fa-solid fa-arrow-up-right-from-square"></i>

      </a>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-5">

    <div id="loading">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Mengambil data dari server Google...</p>
    </div>

    <div id="dashboard-content" style="display: none;">
      <!-- Row Summary Cards -->
      <div class="row mb-4">
        <div class="col-md-6 mb-3">
          <div class="summary-card" style="border-left-color: #0d6efd;">
            <div class="summary-title">Total Progress Unit 1</div>
            <div class="summary-value" id="totU1">0%</div>
            <div class="progress mt-2" style="height: 10px;">
              <div id="barU1" class="progress-bar bg-primary" style="width: 0%"></div>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <div class="summary-card" style="border-left-color: #198754;">
            <div class="summary-title">Total Progress Unit 2</div>
            <div class="summary-value" id="totU2">0%</div>
            <div class="progress mt-2" style="height: 10px;">
              <div id="barU2" class="progress-bar bg-success" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- DataTables -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="table-responsive">
            <table id="dataTable" class="table table-bordered table-hover w-100">
              <thead>
                <tr>
                  <th rowspan="2" style="width: 5%">No</th>
                  <th rowspan="2">Kategori Pekerjaan</th>
                  <th rowspan="2">Sub Pekerjaan</th>
                  <th rowspan="2">Bobot</th>
                  <th colspan="2">Status</th>
                  <th colspan="2">Progress (%)</th>
                </tr>
                <tr>
                  <th>Unit 1</th>
                  <th>Unit 2</th>
                  <th>Unit 1</th>
                  <th>Unit 2</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT KAMU DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbxREUj0nZJ4fZIYurPYamHvFk4FiSQHZM4_nmUGru6znpd04CQf68srwCmFsJSyyXlu/exec";

    $(document).ready(function () {
      // Ambil data via API JSON
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert("Error: " + data.error);
            return;
          }
          renderDashboard(data);
        })
        .catch(error => {
          console.error("Gagal fetch API:", error);
          alert("Gagal mengambil data dari server.");
          $('#loading').html('<span class="text-danger">Koneksi ke database gagal. Cek pengaturan CORS/API.</span>');
        });
    });

    function renderDashboard(response) {
      // Sembunyikan loading, tampilkan dashboard
      $('#loading').hide();
      $('#dashboard-content').fadeIn();

      // 1. Update Summary Cards
      $('#totU1').text(response.summary.total_unit1 + '%');
      $('#barU1').css('width', response.summary.total_unit1 + '%');

      $('#totU2').text(response.summary.total_unit2 + '%');
      $('#barU2').css('width', response.summary.total_unit2 + '%');

      // 2. Format Badge Status
      function formatStatus(status) {
        let text = status ? status.toString().trim() : "";
        if (text.toLowerCase() === 'closed') {
          return `<span class="badge-closed">Closed</span>`;
        } else {
          return `<span class="badge-proses">${text.toUpperCase()}</span>`;
        }
      }

      // 3. Render DataTables
      $('#dataTable').DataTable({
        data: response.items,
        columns: [
          { data: 'no', className: "text-center" },
          { data: 'kategori' },
          { data: 'sub' },
          { data: 'bobot', className: "text-center fw-bold", render: val => val + '%' },
          { data: 'status1', className: "text-center", render: formatStatus },
          { data: 'status2', className: "text-center", render: formatStatus },
          { data: 'prog1', className: "text-center fw-bold text-primary", render: val => val + '%' },
          { data: 'prog2', className: "text-center fw-bold text-success", render: val => val + '%' }
        ],
        pageLength: 32,
        ordering: false,
        language: { search: "Cari Data:" }
      });
    }
  </script>
</body>

</html>
