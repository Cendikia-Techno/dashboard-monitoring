<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KSOT - QA Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f5f7fb;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:30px;
    color:#1d3557;
}

select{

    padding:10px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;

}

.cards{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;

}

.card{

    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.card h3{

    color:#888;
    font-size:14px;
    margin-bottom:10px;

}

.card h2{

    color:#1d3557;
    font-size:32px;

}

.content{

    display:grid;
    grid-template-columns:1fr;
    gap:20px;

}

.panel{

    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#1d3557;
    color:white;
    padding:12px;

}

td{

    padding:12px;
    border-bottom:1px solid #eee;

}

.progress{

    width:100%;
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;

}

.progress div{

    height:100%;
    background:#2ecc71;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>QA Dashboard - KSOT</h1>

<select id="docType">

<option value="itp">Inspection Test Plan</option>

<option value="qplan">Quality Plan</option>

</select>

</div>

<div class="cards">

<div class="card">

<h3>Progress</h3>

<h2 id="overallProgress">0%</h2>

</div>

<div class="card">

<h3>Selesai</h3>

<h2 id="doneCount">0</h2>

</div>

<div class="card">

<h3>Review</h3>

<h2 id="reviewCount">0</h2>

</div>

<div class="card">

<h3>Belum</h3>

<h2 id="pendingCount">0</h2>

</div>

</div>

<div class="content">

<div class="panel">

<h2 style="margin-bottom:20px;">Detail Progress</h2>

<table>

<thead>

<tr>

<th width="50%">Section</th>

<th>Status</th>

<th width="30%">Progress</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

<script>
    const API_URL =
    "https://script.google.com/macros/s/AKfycbx7RJfrZ7XfDXnVUWzIDB9jD95rMtH3Eq2itnBXTrh3OJRtRq8KVNa1KHu62SokLYI/exec";

    let dashboardData = {};
    loadData();

    async function loadData(){

        try{

            const response = await fetch(API_URL);

            dashboardData = await response.json();

            renderDashboard("itp");

        }catch(error){

            console.error(error);

            alert("Gagal mengambil data.");

        }

    }

    function renderDashboard(type){

        let data = [];

        if(type === "itp"){

            data = dashboardData.itpData;

        }else{

            data = dashboardData.qplanData;

        }

        renderSummary(data);

        renderTable(data);

    }

    function renderSummary(data){

        const total = data.length;

        const selesai =
        data.filter(x=>x.status==="Selesai").length;

        const review =
        data.filter(x=>x.status==="Review").length;

        const belum =
        data.filter(x=>x.status==="Belum").length;

        const progress =
        Math.round(

            data.reduce((a,b)=>a+b.progress,0)/total

        );

        document.getElementById("overallProgress").innerHTML =
        progress+"%";

        document.getElementById("doneCount").innerHTML =
        selesai;

        document.getElementById("reviewCount").innerHTML =
        review;

        document.getElementById("pendingCount").innerHTML =
        belum;

    }

    function renderTable(data){

        let html="";

        data.forEach(item=>{

            html+=`

            <tr>

                <td>${item.section}</td>

                <td>${item.status}</td>

                <td>

                    <div class="progress">

                        <div style="width:${item.progress}%"></div>

                    </div>

                    ${item.progress}%

                </td>

            </tr>

            `;

        });

        document.getElementById("tableBody").innerHTML =
        html;

    }

    document
    .getElementById("docType")
    .addEventListener("change",function(){

        renderDashboard(this.value);

    });
    

</script>

</body>
</html>
